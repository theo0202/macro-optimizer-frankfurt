// ── Build-Your-Own-Renderer (Compleat, Dean & David; generisch für Bowl-Menüs) ──
// labels: Anzeigenamen der Rollen auf Karten und in der Config-Karte (Default unten, z.B. Dean & David: dip = "dressing")
const BOWL_LABELS = { base: "base", protein: "protein", dip: "dip", side: "bread" };
function bowlHas(menu, role) { return !!(menu && menu.groups.some(g => g.options.some(o => bowlRole(o) === role))); }
function bowlConfigCard(ctx, note, menu, labels) {
  const L = Object.assign({}, BOWL_LABELS, labels || {});
  const x = (ctx.st && ctx.st.extra) || {};
  const set = patch => ctx.update(s => ({ extra: { ...(s.extra || {}), ...patch } }));
  const halves = !!(menu && menu.groups.some(g => g.options.some(o => o.half)));
  // Portionen-Chip nur für Rollen mit Stepper (maxQty > 1): Compleat „base / protein“, Dean & David „protein“
  const stepRoles = ["base", "protein"].filter(r => menu && menu.groups.some(g => g.options.some(o => bowlRole(o) === r && (o.maxQty || 1) > 1)));
  return h("div", { style: CARD },
    h("div", { style: LBL }, "Max. extras per bowl"),
    h("div", { style: { display: "flex", gap: 5, flexWrap: "wrap", marginBottom: stepRoles.length || note ? 12 : 0 } },
      ...[0, 1, 2, 3, 4, 5, 6].map(n => h(Chip, { key: String(n), label: String(n), active: x.maxExtras === n, onClick: () => set({ maxExtras: n }), small: true }))),
    stepRoles.length > 0 && h("div", { style: LBL }, "Max. portions of the same " + stepRoles.map(r => L[r]).join(" / ") + (halves ? " · half portion = ½" : "")),
    stepRoles.length > 0 && h("div", { style: { display: "flex", gap: 5, marginBottom: note ? 10 : 0 } },
      ...[1, 2, 3, 4].map(n => h(Chip, { key: String(n), label: String(n), active: x.cap === n, onClick: () => set({ cap: n }), small: true }))),
    note && h("div", { style: { fontSize: 10, color: "#666", lineHeight: 1.4 } }, note)
  );
}
function bowlCard(res, ctx, menu, labels) {
  const L = Object.assign({}, BOWL_LABELS, labels || {});
  const c = { base: 0, protein: 0, extra: 0 };
  for (const pt of res.parts) { const r = bowlRole(pt.opt); c[r] = (c[r] || 0) + pt.qty; }
  const bits = [menu ? menu.item : "Bowl"];
  if (bowlHas(menu, "base")) bits.push(c.base + " " + L.base);
  bits.push(c.protein + " " + L.protein, c.extra + (c.extra === 1 ? " extra" : " extras"));
  if (bowlHas(menu, "side")) bits.push(res.side ? L.side : "no " + L.side);
  if (bowlHas(menu, "dip")) bits.push(res.dip ? L.dip : "no " + L.dip);
  return h(ResultCard, { key: res.key, title: bowlSummary(res), sub: bits.join(" · "), n: res.nutrition, price: res.price, selected: ctx.selected, onClick: ctx.onSelect });
}
function bowlSubtitle(menu, sel) {
  const n = sel.items.length;
  return menu.item + " · " + n + (n === 1 ? " component" : " components") + (sel.price != null ? " · " + bowlEuro(sel.price) : "");
}
// Aufschlüsselung je Plattform-Gruppe (kcal · Protein · Preis) + Gesamtpreis inkl. Grundpreis; feste Bestandteile oben („Included“),
// Pflicht-Zutaten mit ★; reine Bestellschritt-Gruppen (ohne Optionen) stecken in den Varianten und bekommen keine eigene Zeile
function bowlPanel(menu, sel, ctx) {
  const rows = [], inc = (ctx && ctx.inc) || new Set();
  const line = { display: "flex", justifyContent: "space-between", gap: 8, fontSize: 12, padding: "4px 0", borderBottom: "1px solid #1f1f1f" };
  const head = (key, text) => h("div", { key, style: { fontSize: 10, color: "#555", fontFamily: S.mono, textTransform: "uppercase", letterSpacing: 1, margin: "8px 0 4px" } }, text);
  const row = (key, opt, qty, priceText) => h("div", { key, style: line },
    h("span", { style: { color: "#e0e0e0", minWidth: 0, flex: 1 } }, (inc.has(opt.ing) ? "★ " : "") + (qty > 1 ? qty + "× " : "") + opt.name),
    h("span", { style: { color: "#999", fontFamily: S.mono, whiteSpace: "nowrap" } }, Math.round(opt.kcal * qty) + " kcal · P " + Math.round(opt.protein * qty * 10) / 10 + "g · " + priceText));
  if (sel.fixed && sel.fixed.length) {
    rows.push(head("_fixed", "Included"));
    for (const x of sel.fixed) rows.push(row("_fixed_" + x.id, x, 1, "incl."));
  }
  for (const g of menu.groups) {
    if (!g.options.length) continue;
    const choice = g.options.some(x => ["dip", "side"].includes(bowlRole(x)));
    const ps = sel.parts.filter(pt => pt.opt.group === g.id);
    for (const x of [sel.side, sel.dip]) if (x && x.group === g.id) ps.push({ opt: x, qty: 1 });
    if (!ps.length && !(choice || (g.min >= 1 && g.none))) continue;
    rows.push(head(g.id, g.name));
    if (!ps.length) rows.push(h("div", { key: g.id + "_none", style: { fontSize: 12, color: "#777", padding: "4px 0", borderBottom: "1px solid #1f1f1f" } }, g.none || "—"));
    for (const pt of ps) rows.push(row(g.id + "_" + pt.opt.id, pt.opt, pt.qty, bowlEuro((pt.opt.price || 0) * pt.qty)));
  }
  if (sel.price != null) rows.push(h("div", { key: "_price", style: { ...line, borderBottom: "none", marginTop: 6 } },
    h("span", { style: { color: "#e0e0e0", minWidth: 0, flex: 1, fontWeight: 600 } }, "Total price",
      h("span", { style: { color: "#777", fontWeight: 400, fontSize: 10 } }, "  " + (menu.basePrice > 0 ? "incl. " + menu.item + " " + bowlEuro(menu.basePrice) + " · " : "") + ((ctx && ctx.R && ctx.R.platform) ? ctx.R.platform + " " : "") + "menu prices, no fees")),
    h("span", { style: { color: "#fff", fontFamily: S.mono, whiteSpace: "nowrap", fontWeight: 600 } }, bowlEuro(sel.price))));
  return h("div", { style: { marginBottom: 16 } }, ...rows);
}

function App() {
  const [tab, setTab] = useState(DEFAULT_TAB);
  const [mode, setMode] = useState("macros");
  const [sortBy, setSortBy] = useState("score");
  const [tP, setTP] = useState(65);
  const [tC, setTC] = useState(85);
  const [tF, setTF] = useState(20);
  const [tK, setTK] = useState(450);
  const [prefs, setPr] = useState({ hp:true, lp:false, hc:false, lc:false, hf:false, lf:true });
  const [showAdv, setAdv] = useState(false);
  const [fibMin, setFibMin] = useState("");
  const [fibMax, setFibMax] = useState("");
  const [sMin, setSMin] = useState("");
  const [sMax, setSMax] = useState("");
  const [maxPrice, setMaxPrice] = useState(""); // Preislimit je Bestellung in € inkl. Grundpreis (User 15.09.2026), leer = keins
  const [imp, setImp] = useState({ busy:false, msg:"", err:false });
  // State pro Restaurant: rs[key] = {cats, maxN, sw, sel, extra} — bleibt beim Tab-Wechsel erhalten. Ziele sind global.
  const [rs, setRs] = useState(() => initRestoStates(RESTAURANTS));
  const [maxAll, setMaxAll] = useState(5); // All/Accurate: max items pro à-la-carte-Bestellung

  // „Add own order": Suche + eigener Warenkorb (localStorage fra_own_order)
  const [searchQ, setSearchQ] = useState("");
  const [myOrder, setMyOrder] = useState(() => { const v = lsGet(LS.ownOrder, []); return Array.isArray(v) ? v : []; });
  useEffect(() => { lsSet(LS.ownOrder, myOrder); }, [myOrder]);
  // Ausschluss-Listen je Restaurant (fra_excluded): { [restaurantKey]: [ids] }
  const [excl, setExcl] = useState(() => { const v = lsGet(LS.excluded, {}); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; });
  useEffect(() => { lsSet(LS.excluded, excl); }, [excl]);
  // Pflicht-Zutaten je Restaurant (fra_included, User 16.09.2026): { [exclusionKey bzw. key]: [Zutat-ids] }
  const [incl, setIncl] = useState(() => { const v = lsGet(LS.included, {}); return v && typeof v === "object" && !Array.isArray(v) ? v : {}; });
  useEffect(() => { lsSet(LS.included, incl); }, [incl]);
  const setInclFor = (key, fn) => setIncl(prev => {
    const nx = fn(Array.isArray(prev[key]) ? prev[key] : []), o = { ...prev };
    if (nx.length) o[key] = nx; else delete o[key];
    return o;
  });
  const setExclFor = (key, fn) => setExcl(prev => {
    const nx = fn(Array.isArray(prev[key]) ? prev[key] : []), o = { ...prev };
    if (nx.length) o[key] = nx; else delete o[key];
    return o;
  });
  const moKey = it => it.resto+"|"+it.name+"|"+it.kcal;
  const addToOrder = it => setMyOrder(o => { const idx = o.findIndex(e => moKey(e.item) === moKey(it));
    if (idx >= 0) { const n = o.slice(); n[idx] = { ...n[idx], qty:n[idx].qty+1 }; return n; } return [...o, { item:it, qty:1 }]; });
  const changeQty = (i, d) => setMyOrder(o => o.map((e, j) => j === i ? { ...e, qty:Math.max(1, e.qty+d) } : e));
  const removeFromOrder = i => setMyOrder(o => o.filter((_, j) => j !== i));
  const clearOrder = () => setMyOrder([]);
  const moTotal = useMemo(() => orderTotal(myOrder), [myOrder]);
  const moResults = useMemo(() => tab === "search" ? searchItems(searchQ, 60) : [], [tab, searchQ]);
  const r1 = x => Math.round(x*10)/10;

  const R = RESTO_BY_KEY[tab] || null; // aktives Registry-Restaurant (null bei Spezial-Tabs) — Restaurant-Blöcke nur mit R rendern
  const st = R ? rs[R.key] : null;
  const exKey = R ? (R.exclusionKey || R.key) : null; // gemeinsame Liste, z.B. Compleat Wolt + Uber Eats
  const exList = R && Array.isArray(excl[exKey]) ? excl[exKey] : [];
  const exSet = useMemo(() => new Set(exList), [exList]);
  const inList = R && Array.isArray(incl[exKey]) ? incl[exKey] : []; // Pflicht-Zutaten teilen sich den Schlüssel der Ausschluss-Liste
  const inSet = useMemo(() => new Set(inList), [inList]);
  const includables = useMemo(() => R ? includablesFor(R) : [], [R]);
  const ingName = id => { const e = includables.find(y => y.id === id); if (e) return e.name; const x = R && R.data && Array.isArray(R.data.ingredients) ? R.data.ingredients.find(y => y.id === id) : null; return x ? x.name : id; };
  const excludables = useMemo(() => R ? excludablesFor(R) : [], [R]);
  const updRS = (key, fn) => setRs(prev => prev[key] ? { ...prev, [key]: { ...prev[key], ...fn(prev[key]) } } : prev);
  const isCross = tab === "all" || tab === "accurate";
  const accList = RESTAURANTS.filter(r => r.accurate);
  const crossEmpty = tab === "accurate" ? accList.length === 0 : tab === "all" ? RESTAURANTS.length === 0 : false;

  const toggleP = k => {
    const opp = { hp:"lp", lp:"hp", hc:"lc", lc:"hc", hf:"lf", lf:"hf" };
    setPr(p => ({ ...p, [k]:!p[k], ...(p[k] ? {} : { [opp[k]]:false }) }));
  };

  // Screenshot-Import: OCR der "Übersicht" → verbleibende Makros (Total−Gegessen) + "Übrig"-kcal automatisch eintragen
  const onImport = async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = "";
    if (!file) return;
    setImp({ busy:true, msg:"Reading screenshot…", err:false });
    try {
      const { text, parsed:r } = await ocrMacroScreenshot(file, p => setImp({ busy:true, msg:"Reading… "+Math.round(p*100)+"%", err:false }));
      try { console.log("[OCR text]\n"+text); } catch (e2) {}
      if (!r) { const snip = (text||"").replace(/\s+/g," ").trim().slice(0,180); setImp({ busy:false, msg:"Couldn't read the macro bars. The scanner saw: \""+snip+"\" — try a clearer/cropped screenshot of the overview, or enter manually.", err:true }); return; }
      setTC(r.carbs); setTP(r.protein); setTF(r.fat); setTK(r.kcal);
      setImp({ busy:false, msg:"Imported  C "+r.carbs+" · P "+r.protein+" · F "+r.fat+" · "+r.kcal+" kcal"+(r.kcalComputed?" (kcal estimated)":""), err:false });
    } catch (err) {
      setImp({ busy:false, msg:"OCR failed — needs internet on first use (downloads the recogniser). Try again or enter manually.", err:true });
    }
  };

  const targets = useMemo(() => {
    const t = { protein:0, carbs:0, fat:0, kcal:0, fibMin:null, fibMax:null, sMin:null, sMax:null, maxPrice:null };
    if (mode === "macros") { t.protein = tP||0; t.carbs = tC||0; t.fat = tF||0; t.kcal = t.protein*4 + t.carbs*4 + t.fat*9; }
    else { t.kcal = tK||0; }
    if (fibMin !== "") t.fibMin = Number(fibMin); if (fibMax !== "") t.fibMax = Number(fibMax);
    if (sMin !== "") t.sMin = Number(sMin); if (sMax !== "") t.sMax = Number(sMax);
    if (maxPrice !== "" && isFinite(Number(maxPrice)) && Number(maxPrice) >= 0) t.maxPrice = Number(maxPrice);
    return t;
  }, [mode, tP, tC, tF, tK, fibMin, fibMax, sMin, sMax, maxPrice]);

  // Nur das aktive Restaurant rechnen; sel ist bewusst KEINE Abhängigkeit (Auswahl ändert die Ergebnisse nicht)
  const results = useMemo(() => (R && st) ? runOptimize(R, targets, mode, prefs, st, exSet, inSet) : [],
    [R, targets, mode, prefs, st && st.cats, st && st.maxN, st && st.sw, st && st.extra, exSet, inSet]);
  const resultsCross = useMemo(() => isCross ? optimizeAll(targets, mode, prefs, maxAll, tab === "accurate", undefined, excl, incl) : [],
    [tab, targets, mode, prefs, maxAll, excl, incl]);
  const activeResults = isCross ? resultsCross : results;

  const sel = st ? st.sel : null;
  const selKey = resultKey(sel); // Karte wird über den stabilen Key markiert, nicht über Objekt-Identität
  const toggleSel = r => updRS(R.key, s => ({ sel: s.sel && resultKey(s.sel) === resultKey(r) ? null : r }));
  // All/Accurate: Klick → in den Restaurant-Tab wechseln und das Ergebnis dort öffnen
  const selectAcross = r => { setTab(r._resto); updRS(r._resto, () => ({ sel:r })); };

  const autoK = mode === "macros" ? (tP||0)*4 + (tC||0)*4 + (tF||0)*9 : tK;
  const tg = { kcal: mode==="macros" ? autoK : tK, carbs: mode==="macros" ? tC : 0, protein: mode==="macros" ? tP : 0, fat: mode==="macros" ? tF : 0,
    fibre: fibMin !== "" ? Number(fibMin) : 0, salt: sMax !== "" ? Number(sMax) : 0 };
  // Sort by: im Kalorien-Modus gibt es keine Makro-Ziele → Protein/Carbs/Fat fallen auf Score zurück
  const effSort = (mode==="macros"||sortBy==="score"||sortBy==="kcal") ? sortBy : "score";
  const sortTgts = { kcal: mode==="macros" ? autoK : (tK||0), protein:tP||0, carbs:tC||0, fat:tF||0 };

  const btn = (v,l,cur,fn) => h("button",{onClick:()=>fn(v),style:{
    flex:1,padding:"11px 0",borderRadius:8,
    border:cur===v?"1px solid "+S.green:"1px solid #2a2a2a",
    background:cur===v?"rgba(0,151,67,0.1)":"#151515",
    color:cur===v?"#4ade80":"#888",fontSize:12,fontWeight:600,cursor:"pointer",fontFamily:S.font,
  }},l);

  const spec = SPECIAL_TABS.find(s => s.key === tab);
  const grad = spec ? spec.gradient : R ? R.gradient : ["#3f3f46","#18181b"];
  // Kontext für Build-Your-Own-Renderer
  const ctx = { R, st, tg, targets, mode, prefs, selKey, toggleSel, inc: inSet, ex: exSet, update: fn => R && updRS(R.key, fn) };
  const inputHint = tab==="search" ? "your target — compare your own order below"
    : tab==="all" ? "across all restaurants — best picks"
    : tab==="accurate" ? "across accurate restaurants — best picks"
    : R ? (R.kind==="byo" ? (R.inputHint ? R.inputHint(st) : "build your own") : "à la carte: 1–"+(st.maxN===Infinity?"∞":st.maxN)+" Items") : "";
  const overrideSw = (R && st) ? (R.switches||[]).find(s => s.overridesCats && st.sw[s.id]) : null;

  return h("div",{style:{minHeight:"100vh",background:S.bg,color:"#e0e0e0",fontFamily:S.font,paddingBottom:40}},

    // Header
    h("div",{style:{background:"linear-gradient(135deg,"+grad[0]+","+grad[1]+")",padding:"20px 20px 16px",position:"relative",overflow:"hidden"}},
      h("div",{style:{position:"absolute",top:-20,right:-20,width:120,height:120,borderRadius:"50%",background:"rgba(255,255,255,0.06)"}}),
      h("div",{style:{fontSize:10,letterSpacing:3,textTransform:"uppercase",color:"rgba(255,255,255,0.6)",fontFamily:S.mono,marginBottom:4}},spec?spec.header:R?R.label:""),
      h("div",{style:{fontSize:22,fontWeight:700,color:"#fff",letterSpacing:-0.5}},"Macro Optimizer"),
      h("div",{style:{fontSize:11,color:"rgba(255,255,255,0.5)",marginTop:2}},"Find the optimal order for your goals")

    h("div",{style:{padding:"16px 16px 0"}},

      // Modus (vor der Restaurant-Wahl: Ziele bleiben beim Wechsel erhalten)
      h("div",{style:{display:"flex",gap:8,marginBottom:16}},

        btn("calories","Calories + preferences",mode,setMode)
      ),

      // Screenshot-Import (verbleibende Makros + Kalorien per On-Device-OCR)
      h("div",{style:{marginBottom:16}},
        h("label",{style:{display:"inline-flex",alignItems:"center",gap:8,cursor:imp.busy?"progress":"pointer",
            padding:"10px 14px",borderRadius:8,border:"1px solid #2a2a2a",background:"#151515",
            color:"#bbb",fontSize:12,fontWeight:600,fontFamily:S.font,opacity:imp.busy?0.65:1}},
          h("span",{style:{fontSize:15}},"📷"),
          imp.busy?imp.msg:"Import from screenshot",
          h("input",{type:"file",accept:"image/*",disabled:imp.busy,onChange:onImport,style:{display:"none"}})
        ),
        imp.msg&&!imp.busy&&h("div",{style:{marginTop:6,fontSize:11,fontFamily:S.mono,color:imp.err?"#f87171":"#4ade80"}},
          (imp.err?"":"✓ ")+imp.msg)
      ),

      // Eingabe
      h("div",{style:{background:"#151515",borderRadius:12,padding:16,marginBottom:16,border:"1px solid #222"}},
        mode==="macros"?h("div",null,
          h("div",{style:{display:"flex",gap:10,marginBottom:10}},
            h(NumIn,{label:"Carbs",value:tC,onChange:setTC,placeholder:"45",unit:"g"}),
            h(NumIn,{label:"Protein",value:tP,onChange:setTP,placeholder:"30",unit:"g"}),
            h(NumIn,{label:"Fat",value:tF,onChange:setTF,placeholder:"12",unit:"g"})

        h("button",{onClick:()=>setAdv(!showAdv),style:{background:"none",border:"none",color:"#666",fontSize:11,cursor:"pointer",fontFamily:S.mono,textDecoration:"underline",padding:0}},
          showAdv?"Less ▴":"Fibre / Salt / Price ▾"+(targets.maxPrice!=null?" · max "+bowlEuro(targets.maxPrice):""))

        h("div",{style:{display:"flex",gap:10,marginBottom:10}},

        h("div",{style:{display:"flex",gap:10,marginTop:10,alignItems:"flex-end"}},

          h("div",{style:{flex:1,minWidth:80,fontSize:10,color:"#666",lineHeight:1.4,paddingBottom:2}},"Per order incl. base price · menu prices only, no delivery or service fees")

      // Tabs: Spezial-Tabs, dann die Registry-Restaurants
      h("div",{style:{display:"flex",flexWrap:"wrap",gap:8,marginBottom:16}},
        ...SPECIAL_TABS.map(s=>btn(s.key,s.label,tab,setTab)),
        ...RESTAURANTS.map(r=>btn(r.key,r.name,tab,setTab))
      ),

      // All/Accurate: max items pro à-la-carte-Bestellung
      isCross&&!crossEmpty&&h("div",{style:{...CARD,marginBottom:16}},
        h("div",{style:LBL},"Max. items per order"),
        h("div",{style:{display:"flex",gap:5,marginBottom:8}},
          ...[1,2,3,5,Infinity].map(n=>h(Chip,{key:String(n),label:n===Infinity?"∞":String(n),active:maxAll===n,onClick:()=>setMaxAll(n),small:true}))
        ),
        h("div",{style:{fontSize:10,color:"#666",lineHeight:1.4}},"Applies to all à-la-carte restaurants (one best order per restaurant). Build-your-own restaurants build one composed order regardless.")
      ),
      // All/Accurate ohne Restaurants: Hinweis statt Ergebnisliste
      crossEmpty&&h("div",{style:{...CARD,padding:16,marginBottom:16}},
        h("div",{style:{fontSize:13,fontWeight:600,color:"#ddd",marginBottom:4}},tab==="accurate"?"No accurate restaurants yet":"No restaurants yet"),
        h("div",{style:{fontSize:12,color:"#888",lineHeight:1.5}},tab==="accurate"
          ?"Restaurants show up here once their nutrition data is verified from official sources. Meanwhile, use “All restaurants”."
          :"Add a restaurant to the registry to get started.")
      ),

      // À la carte: Kategorien + Max-Items (+ Hinweis) — generisch aus der Registry
      R&&R.kind==="ac"&&h("div",{style:CARD},
        h("div",{style:LBL},"Categories",overrideSw&&h("span",{style:{color:"#777",textTransform:"none",letterSpacing:0}},"  · ignored while “"+overrideSw.label+"” is on")),
        h("div",{style:{display:"flex",flexWrap:"wrap",gap:5,marginBottom:12,opacity:overrideSw?0.45:1}},
          ...R.data.cats.filter(c=>!c.drink).map(c=>h(Chip,{key:c.id,label:c.name,active:!!st.cats[c.id],
            onClick:()=>updRS(R.key,s=>({cats:{...s.cats,[c.id]:!s.cats[c.id]}}))}))
        ),
        h("div",{style:LBL},"Max. items per order"),
        h("div",{style:{display:"flex",gap:5,marginBottom:R.note?10:0}},
          ...[1,2,3,5,Infinity].map(n=>h(Chip,{key:String(n),label:n===Infinity?"∞":String(n),active:st.maxN===n,onClick:()=>updRS(R.key,()=>({maxN:n})),small:true}))
        ),
        R.note&&h("div",{style:{fontSize:10,color:"#666",lineHeight:1.4}},R.note)
      ),
      // Build-Your-Own: eigene Config
      R&&R.kind==="byo"&&R.renderConfig(ctx),

      // Schalter (deklarativ aus der Registry; group = UI-exklusiv)
      h("div",{style:{display:"flex",gap:16,marginBottom:16,alignItems:"center",flexWrap:"wrap"}},
        ...(R?(R.switches||[]):[]).flatMap(s=>[
          h("label",{key:s.id,style:{display:"flex",alignItems:"center",gap:6,cursor:"pointer",fontSize:12,color:"#999"}},
            h("input",{type:"checkbox",checked:!!st.sw[s.id],onChange:e=>{const on=e.target.checked;updRS(R.key,x=>({sw:toggleSwitch(R,x.sw,s.id,on)}));},style:{accentColor:S.green,width:16,height:16}}),
            s.label),
          s.hint?h("div",{key:s.id+"_hint",style:{flexBasis:"100%",fontSize:11,color:"#7a7",fontStyle:"italic",margin:"-8px 0 0 22px",lineHeight:1.4}},s.hint):null,
        ])
      ),

      // Ausschluss-Liste (ausverkauft / heute keine Lust) — generisch für jedes Registry-Restaurant
      // Pflicht-Zutaten („Must include“) — für BYO-Restaurants mit includables(); Ausschluss und Pflicht schließen sich gegenseitig aus
      R&&includables.length>0&&h(IncludeCard,{key:"in_"+R.key,list:includables.filter(x=>!exSet.has(x.id)),included:inList,platform:R.platform,nameOf:ingName,
        onAdd:id=>{setInclFor(exKey,cur=>addInclude(cur,id,includables));setExclFor(exKey,cur=>cur.filter(x=>x!==id));},
        onRemove:id=>setInclFor(exKey,cur=>cur.filter(x=>x!==id)),
        onClear:()=>setInclFor(exKey,()=>[])}),
      R&&h(ExcludeCard,{key:"ex_"+R.key,list:excludables,excluded:exList,
        onAdd:id=>{setExclFor(exKey,cur=>cur.includes(id)?cur:[...cur,id]);setInclFor(exKey,cur=>cur.filter(x=>x!==id));},
        onRemove:id=>setExclFor(exKey,cur=>cur.filter(x=>x!==id)),
        onClear:()=>setExclFor(exKey,()=>[])}),

      // „Add own order" — Suche über alle Restaurants + eigener Warenkorb (zum nachträglichen Tracken)
      tab==="search"&&h("div",{style:{marginBottom:20}},
        h("div",{style:{fontSize:10,color:"#555",fontFamily:S.mono,textTransform:"uppercase",letterSpacing:2,marginBottom:6}},"Add own order"),
        h("div",{style:{fontSize:11,color:"#777",marginBottom:10,lineHeight:1.5}},"Search any dish across all restaurants and add what you actually ordered — the macros are summed below so you can track it."),
        h("input",{type:"text",value:searchQ,onChange:e=>setSearchQ(e.target.value),placeholder:"Search a dish or restaurant…",
          style:{width:"100%",boxSizing:"border-box",background:"#151515",border:"1px solid #2a2a2a",borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:14,fontFamily:S.font,outline:"none",marginBottom:12}}),
        searchQ.trim()&&h("div",{style:{display:"flex",flexDirection:"column",gap:6,marginBottom:18}},
          moResults.length===0
            ? h("div",{style:{fontSize:12,color:"#666",fontFamily:S.mono}},"No matches.")
            : moResults.map((it,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,background:"#141414",border:"1px solid #222",borderRadius:9,padding:"9px 11px"}},
                h("div",{style:{minWidth:0,flex:1}},
                  h("div",{style:{display:"flex",alignItems:"center",gap:7,marginBottom:2}},
                    h("span",{style:{fontSize:8,fontWeight:700,color:"#93c5fd",background:"rgba(37,99,235,0.16)",border:"1px solid rgba(37,99,235,0.4)",borderRadius:5,padding:"2px 5px",fontFamily:S.mono,textTransform:"uppercase",letterSpacing:0.5,whiteSpace:"nowrap"}},it.resto),
                    h("span",{style:{fontSize:13,color:"#eee",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},it.name)),
                  h("div",{style:{fontSize:10,fontFamily:S.mono,color:"#888"}},Math.round(it.kcal)+" kcal · P "+r1(it.protein)+" · C "+r1(it.carbs)+" · F "+r1(it.fat))),
                h("button",{onClick:()=>addToOrder(it),style:{flexShrink:0,background:S.green,border:"none",color:"#fff",borderRadius:8,padding:"7px 12px",fontSize:12,fontWeight:700,cursor:"pointer",fontFamily:S.font}},"+ Add")
              ))
        ),
        h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}},
          h("div",{style:{fontSize:10,color:"#555",fontFamily:S.mono,textTransform:"uppercase",letterSpacing:2}},"My order"+(myOrder.length?" · "+myOrder.reduce((s,e)=>s+e.qty,0)+" items":"")),
          myOrder.length>0&&h("button",{onClick:clearOrder,style:{background:"none",border:"none",color:"#777",fontSize:11,cursor:"pointer",fontFamily:S.mono,textDecoration:"underline",padding:0}},"Clear")
        ),
        myOrder.length===0
          ? h("div",{style:{fontSize:12,color:"#666",marginBottom:16}},"Nothing added yet. Search above and tap “+ Add”.")
          : h("div",null,
              h("div",{style:{display:"flex",flexDirection:"column",gap:6,marginBottom:14}},
                ...myOrder.map((e,i)=>h("div",{key:i,style:{display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,background:"#151515",border:"1px solid #222",borderRadius:9,padding:"8px 10px"}},
                  h("div",{style:{minWidth:0,flex:1}},
                    h("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:2}},
                      h("span",{style:{fontSize:8,fontWeight:700,color:"#93c5fd",fontFamily:S.mono,textTransform:"uppercase",letterSpacing:0.5,whiteSpace:"nowrap"}},e.item.resto),
                      h("span",{style:{fontSize:13,color:"#eee",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},e.item.name)),
                    h("div",{style:{fontSize:10,fontFamily:S.mono,color:"#888"}},Math.round(e.item.kcal*e.qty)+" kcal · P "+r1(e.item.protein*e.qty)+" · C "+r1(e.item.carbs*e.qty)+" · F "+r1(e.item.fat*e.qty))),
                  h("div",{style:{display:"flex",alignItems:"center",gap:6,flexShrink:0}},
                    h("button",{onClick:()=>changeQty(i,-1),style:{width:26,height:26,borderRadius:7,border:"1px solid #333",background:"#1c1c1c",color:"#ccc",fontSize:16,lineHeight:1,cursor:"pointer",fontFamily:S.font}},"−"),
                    h("span",{style:{fontSize:13,fontFamily:S.mono,color:"#fff",minWidth:18,textAlign:"center"}},e.qty),
                    h("button",{onClick:()=>changeQty(i,1),style:{width:26,height:26,borderRadius:7,border:"1px solid #333",background:"#1c1c1c",color:"#ccc",fontSize:16,lineHeight:1,cursor:"pointer",fontFamily:S.font}},"+"),
                    h("button",{onClick:()=>removeFromOrder(i),style:{width:26,height:26,borderRadius:7,border:"1px solid #3a2a2a",background:"#1c1414",color:"#f87171",fontSize:13,lineHeight:1,cursor:"pointer",fontFamily:S.font}},"✕")
                  )
                ))
              ),
              h("div",{style:{background:"#0d0d0d",borderRadius:10,padding:14,border:"1px solid #2a2a2a"}},
                h("div",{style:{fontSize:10,color:"#888",fontFamily:S.mono,textTransform:"uppercase",letterSpacing:1,marginBottom:10}},mode==="macros"?"Order total vs target":(tK?"Order total vs "+tK+" kcal":"Order total")),
                h(MacroBars,{n:moTotal,tg,mb:0})

      // Ergebnisse: Header + Sort by (Accuracy-Sortierung)
      tab!=="search"&&!crossEmpty&&(isCross||R)&&h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:8,marginBottom:10}},
        h("div",{style:{fontSize:10,color:"#555",fontFamily:S.mono,textTransform:"uppercase",letterSpacing:2}},"Top results"),
        h("div",{style:{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}},
          h("span",{style:{fontSize:9,color:"#555",fontFamily:S.mono,textTransform:"uppercase",letterSpacing:1}},"Sort by"),
          h(Chip,{label:"Score",small:true,active:sortBy==="score",onClick:()=>setSortBy("score")}),

      // Arbeitsbudget der Bowl-Suche erschöpft (nur Extrem-Einstellungen): ehrlich sagen, dass die Liste nicht vollständig geprüft ist
      tab!=="search"&&!crossEmpty&&(isCross||R)&&activeResults.approx&&h("div",{style:{...CARD,padding:"10px 12px",border:"1px solid #5a4a1a",background:"rgba(251,191,36,0.08)",fontSize:11,color:"#e5c07b",lineHeight:1.45,marginBottom:10}},
        "Search stopped early: these settings allow too many combinations to check every bowl in time. The bowls below are good, but maybe not the exact best. For an exact result, lower “Max. portions” or “Max. extras”, or turn on “No dip”."),
      // Ergebnisliste: 20 berechnet, 8 angezeigt
      tab!=="search"&&!crossEmpty&&(isCross||R)&&h("div",{style:{display:"flex",flexDirection:"column",gap:8,marginBottom:20}},
        ...sortResults(activeResults,effSort,sortTgts).slice(0,8).map((r,i)=>{
          if(isCross){
            const rr=RESTO_BY_KEY[r._resto];
            return h(ResultCard,{key:i,badge:rr?rr.name:r._resto,title:rr?summarizeResult(rr,r):"",n:r.nutrition,price:r.price,onClick:()=>selectAcross(r),hint:"tap → details"});
          }
          if(R.kind==="byo") return R.renderCard(r,{...ctx,selected:resultKey(r)===selKey,onSelect:()=>toggleSel(r)});
          const cats=[...new Set(r.items.map(x=>{const c=R.data.cats.find(y=>y.id===x.cat);return c?c.name:x.cat;}))];
          return h(ResultCard,{key:i,title:comboLabel(r.items),sub:r.items.length+(r.items.length===1?" Item · ":" Items · ")+cats.join(" · "),
            n:r.nutrition,price:r.price,selected:resultKey(r)===selKey,onClick:()=>toggleSel(r)});
        }),
        activeResults.length===0&&h("div",{style:{fontSize:12,color:"#888",fontFamily:S.mono,padding:"4px 0"}},
          !isCross&&activeResults.missing?"Not on the "+R.platform+" menu: "+activeResults.missing.map(ingName).join(", ")+" — remove it from “Must include” or try another tab."
            :!isCross&&activeResults.conflict?"These picks don't fit together in one order: "+activeResults.conflict.map(ingName).join(" / ")+" — keep fewer of them in “Must include”."
            :isCross?(targets.maxPrice!=null?"No results within "+bowlEuro(targets.maxPrice)+" — raise the price limit.":"No results.")
            :targets.maxPrice!=null&&(R.kind==="byo"||R.data.items.some(x=>x.price!=null))?"No results within "+bowlEuro(targets.maxPrice)+" — raise the price limit, relax the switches or remove exclusions"+(inList.length?" or picks.":".")
            :R.kind==="byo"?"No results — relax the switches or remove exclusions"+(inList.length?" or picks.":"."):"No results — turn on more categories, relax the switches or remove exclusions.")
      ),

      // Detail-Panel + Order Guide (generisch; BYO liefert den Mittelteil über renderPanel)
      R&&sel&&h("div",{style:{background:"#151515",borderRadius:12,border:"1px solid "+S.green,padding:16}},
        h("div",{style:{fontSize:15,fontWeight:700,color:"#fff",marginBottom:4}},summarizeResult(R,sel)),
        h("div",{style:{fontSize:11,color:"#777",marginBottom:12,fontFamily:S.mono}},
          R.kind==="byo"?(R.panelSubtitle?R.panelSubtitle(sel):"build your own"):"à la carte · "+sel.items.length+(sel.items.length===1?" Item":" Items")),
        h(MacroBars,{n:sel.nutrition,tg}),
        R.kind==="byo"?R.renderPanel(sel,ctx):h("div",{style:{marginBottom:16}},
          h("div",{style:{fontSize:10,color:"#555",fontFamily:S.mono,textTransform:"uppercase",letterSpacing:1,marginBottom:6}},"Items"),
          ...sel.items.map((x,xi)=>h("div",{key:xi,style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,fontSize:12,padding:"4px 0",borderBottom:xi<sel.items.length-1?"1px solid #1f1f1f":"none"}},
            h("span",{style:{color:"#e0e0e0",minWidth:0,flex:1}},(inSet.has(x.id)||(x.product&&inSet.has(x.product))?"★ ":"")+x.name),
            h("span",{style:{color:"#999",fontFamily:S.mono,whiteSpace:"nowrap"}},x.kcal+" kcal · P "+x.protein+"g"+(x.price!=null?" · "+bowlEuro(x.price):""))
          )),
          sel.price!=null&&h("div",{style:{display:"flex",justifyContent:"space-between",gap:8,fontSize:12,padding:"6px 0 0",marginTop:4,borderTop:"1px solid #1f1f1f"}},
            h("span",{style:{color:"#e0e0e0",fontWeight:600}},"Total price",h("span",{style:{color:"#777",fontWeight:400,fontSize:10}},"  "+R.platform+" menu prices, no fees")),
            h("span",{style:{color:"#fff",fontFamily:S.mono,fontWeight:600,whiteSpace:"nowrap"}},bowlEuro(sel.price)))
        ),
        h(OrderGuide,{platform:R.platform,steps:orderStepsFor(R,sel)})
      ),

      // Footer
      h("div",{style:{marginTop:20,fontSize:9,color:"#444",fontFamily:S.mono,lineHeight:1.5,textAlign:"center"}},
        tab==="search"?"Add own order: search any dish across all "+RESTAURANTS.length+" restaurant"+(RESTAURANTS.length===1?"":"s")+" · saved on this device"
        :tab==="accurate"?(accList.length?"Accurate restaurants: "+accList.map(r=>r.name).join(" · "):"Accurate restaurants: none yet")
        :tab==="all"?"Best picks across all restaurants — one per restaurant, default switches"
        :R?(R.footer||"Data: "+R.name):"")
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
