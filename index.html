// London- und Frankfurt-Tool laufen auf DERSELBEN Origin (theo0202.github.io) → gleichnamige Keys würden sich gegenseitig
// überschreiben. Deshalb läuft JEDER Zugriff über lsGet/lsSet, die das Präfix "fra_" voranstellen (tests.js prüft das statisch).
const LS_PREFIX = "fra_";
const LS = { ownOrder: "own_order", excluded: "excluded", included: "included" }; // → "fra_own_order", "fra_excluded", "fra_included"
function lsGet(key, fallback) {
  try { const raw = localStorage.getItem(LS_PREFIX + key); return raw == null ? fallback : JSON.parse(raw); }
  catch (e) { return fallback; }
}
function lsSet(key, value) {
  try { localStorage.setItem(LS_PREFIX + key, JSON.stringify(value)); } catch (e) {}
}

// ═══ Kern-Helper (inhaltlich identisch zum London-Tool) ═══
const KEYS = ["kcal","fat","sat","carbs","sugars","fibre","protein","salt"];

// Summe der 8 Makros, 1 Dezimale. items zählen ×mult, singleItems immer ×1 (Reserve für spätere Größen-Logik bei BYO).
function sumN(items, mult, singleItems) {
  const b = {}; KEYS.forEach(k => b[k] = 0);
  items.forEach(it => { if(it) KEYS.forEach(k => b[k] += (it[k]||0)*mult); });
  (singleItems||[]).forEach(it => { if(it) KEYS.forEach(k => b[k] += (it[k]||0)); });
  KEYS.forEach(k => b[k] = Math.round(b[k]*10)/10);
  return b;
}

// Abweichung vom Ziel (kleiner = besser). Makro-Modus: Protein ×3, Carbs ×2, Fett ×2 (relativ zum Ziel).
// Kalorien-Modus: kcal ×4 + Präferenz-Boni/-Strafen über die Energieanteile. Fibre/Salt-Grenzen als Zusatzstrafen.
function score(a, t, mode, p) {
  let s = 0;
  if(mode==="macros") {
    if(t.protein>0) s += Math.abs(a.protein-t.protein)/Math.max(t.protein,1)*3;
    if(t.carbs>0) s += Math.abs(a.carbs-t.carbs)/Math.max(t.carbs,1)*2;
    if(t.fat>0) s += Math.abs(a.fat-t.fat)/Math.max(t.fat,1)*2;
  } else {
    if(t.kcal>0) s += Math.abs(a.kcal-t.kcal)/Math.max(t.kcal,1)*4;
    const pr=a.protein*4/Math.max(a.kcal,1), cr=a.carbs*4/Math.max(a.kcal,1), fr=a.fat*9/Math.max(a.kcal,1);
    if(p.hp) s-=pr*2; if(p.lp) s+=pr*1.5;
    if(p.hc) s-=cr*1.5; if(p.lc) s+=cr*2;
    if(p.hf) s-=fr*1.5; if(p.lf) s+=fr*2;
  }
  if(t.fibMin!=null&&a.fibre<t.fibMin) s+=(t.fibMin-a.fibre)*0.5;
  if(t.fibMax!=null&&a.fibre>t.fibMax) s+=(a.fibre-t.fibMax)*0.5;
  if(t.sMin!=null&&a.salt<t.sMin) s+=(t.sMin-a.salt)*0.3;
  if(t.sMax!=null&&a.salt>t.sMax) s+=(a.salt-t.sMax)*0.3;
  return s;
}

// "Sort by": sortiert die Top-20-Kandidaten nach Accuracy EINER Dimension
// (|Ist − Ziel|, Tie-Breaker: Gesamt-Score). sortBy="score" = unverändert (Optimizer-Reihenfolge).
function sortResults(arr, sortBy, tgts) {
  if(sortBy==="score")return arr;
  const tgt=tgts[sortBy]||0;
  return [...arr].sort((a,b)=>
    Math.abs(a.nutrition[sortBy]-tgt)-Math.abs(b.nutrition[sortBy]-tgt)||a.score-b.score);
}

// ── Screenshot-Import (OCR) — 1:1 aus dem London-Tool ──
// Liest die "Übersicht" eines Makro-Trackers (z.B. YAZIO) aus einem hochgeladenen Screenshot und füllt die
// VERBLEIBENDEN Makros (Total − Gegessen) + die "Übrig"-Kalorien automatisch ein. Alles UNTER der Übersicht
// (Frühstück/Mittagessen … in kcal) wird ignoriert: die Makro-Balken enden auf "g", die Meal-Rows auf "kcal".
// parseMacroScreenshot ist rein (Text → {carbs,protein,fat,kcal}|null) und in tests.js abgesichert.
function parseMacroScreenshot(ocrText) {
  if (ocrText == null || typeof ocrText !== "string") return null;
  const norm = s => String(s).toLowerCase().replace(/ü/g,"u").replace(/ö/g,"o").replace(/ä/g,"a").replace(/ß/g,"ss");
  const stripTh = n => String(n).replace(/[.,](?=\d{3}\b)/g, "");       // 2.267 -> 2267, echte Dezimale (12,4) bleiben
  const toInt = n => { const c = stripTh(n).replace(/[^\d]/g,""); return c==="" ? null : parseInt(c,10); };
  const lines = ocrText.split(/\r?\n/);

  // 1) Makro-Paare. Pass A: "N <sep> M <unit>" — Trenner tolerant (/ | I l ) ], \s matcht \n), Unit klassifiziert.
  //    Erste 3 Paare, deren Unit NICHT kcal/kj/kg ist (Meal-Rows + Gewicht raus) = Carbs, Protein, Fat.
  //    Robust gegen fehlendes/verlesenes "g": die Übersicht-Makros stehen immer oben, kcal-Meal-Rows darunter.
  const ENERGY = u => u === "kcal" || u === "kj" || u === "kg";
  const macros = []; let m;
  const reA = /(\d[\d.,]*)\s*[\/|Il)\]]\s*(\d[\d.,]*)\s*([a-z]{0,4})/gi;
  while ((m = reA.exec(ocrText)) !== null) {
    if (ENERGY((m[3] || "").toLowerCase())) continue;
    const eaten = toInt(m[1]), total = toInt(m[2]);
    if (eaten == null || total == null || total <= 0) continue;
    macros.push({ eaten, total });
    if (macros.length >= 3) break;
  }
  // Pass B (Fallback, falls der Slash ganz verschluckt wurde): "N <leerraum> M g" — durch das "g" verankert.
  if (macros.length < 3) {
    macros.length = 0;
    const reB = /(\d[\d.,]*)\s+(\d[\d.,]*)\s*g(?![a-z])/gi;
    while ((m = reB.exec(ocrText)) !== null) {
      const eaten = toInt(m[1]), total = toInt(m[2]);
      if (eaten == null || total == null || total <= 0) continue;
      macros.push({ eaten, total });
      if (macros.length >= 3) break;
    }
  }
  if (macros.length < 3) return null;
  let carbs   = Math.max(0, macros[0].total - macros[0].eaten);
  let protein = Math.max(0, macros[1].total - macros[1].eaten);
  let fat     = Math.max(0, macros[2].total - macros[2].eaten);
  let computedKcal = carbs*4 + protein*4 + fat*9;

  // 2) "Übrig"-Kalorien — angezeigten Wert bevorzugen (Reihenfolge der Top-Zahlen: Gegessen, Übrig, Verbrannt).
  const isMacroBar = ln => { const mm = /(\d[\d.,]*)\s*[\/|Il)\]]\s*(\d[\d.,]*)\s*([a-z]{0,4})/i.exec(ln); return !!mm && !ENERGY((mm[3] || "").toLowerCase()); };
  const isKcal = ln => /kcal/i.test(ln);
  const numsIn = ln => { const out=[], re=/\d[\d.,]*/g; let mm; while((mm=re.exec(ln))!==null){const v=toInt(mm[0]); if(v!=null)out.push(v);} return out; };
  const hasUbrig = ln => /(ubrig|obrig|\bbrig\b)/.test(norm(ln));

  let posKcal = null;
  for (let i=0;i<lines.length && posKcal==null;i++){                 // Label + Zahl in DERSELBEN Zeile
    if (!hasUbrig(lines[i]) || isMacroBar(lines[i])) continue;
    const nb = numsIn(lines[i]); if (!nb.length) continue;
    // NICHT Math.max: steht der ganze Ring auf EINER Zeile ("1.688 Gegessen 1.112 Übrig 0 Verbrannt"),
    // würde max die GEGESSEN-Zahl (1688) statt Übrig (1112) greifen. Stattdessen die Zahl der Zeile nehmen,
    // die dem Makro-Rest am nächsten liegt (= der Übrig-Wert). Nur bei kaputtem Rest (g->9-Fall, >6000) -> Math.max.
    posKcal = (computedKcal>0 && computedKcal<=6000)
      ? nb.reduce((a,b)=>Math.abs(b-computedKcal)<Math.abs(a-computedKcal)?b:a)
      : Math.max.apply(null, nb);
  }
  if (posKcal==null) for (let j=0;j<lines.length && posKcal==null;j++){  // Zahlen in Nachbarzeile ±1..2 → Index 1 = Übrig
    if (!hasUbrig(lines[j])) continue;
    const cand=[]; for(let d=1;d<=2;d++){ if(j+d<lines.length)cand.push(j+d); if(j-d>=0)cand.push(j-d); }
    for (const ci of cand){ if(posKcal!=null)break; const ln=lines[ci]; if(isMacroBar(ln)||isKcal(ln))continue;
      const ns=numsIn(ln); if(!ns.length)continue; posKcal = ns.length>=2 ? ns[1] : ns[0]; }
  }

  // Sicherheitsnetz: zerfällt der Ring (533 / 2.267 / 0) bei der OCR in getrennte Zeilen, erwischt die
  // Positionslogik evtl. die "0". Dann aus den Top-Zahlen (keine Makro/kcal-Zeile, 100..9999) die nehmen,
  // die dem berechneten Rest (computedKcal) am nächsten ist — der angezeigte "Übrig"-Wert liegt da immer nah dran.
  const cands = [];
  for (const ln of lines){ if(isMacroBar(ln)||isKcal(ln))continue; for(const v of numsIn(ln)) if(v>=100&&v<=9999) cands.push(v); }
  let best = null;
  for (const v of cands) if (best==null || Math.abs(v-computedKcal) < Math.abs(best-computedKcal)) best = v;

  let kcal, kcalComputed = false;
  if (posKcal == null) { if (best != null) kcal = best; else { kcal = computedKcal; kcalComputed = true; } }
  else if (posKcal < 0.6*computedKcal && best != null && Math.abs(best-computedKcal) < Math.abs(posKcal-computedKcal)) kcal = best;
  else kcal = posKcal;

  // 3) "g→9"-Korrektur: liest die OCR das Einheiten-"g" als "9" und hängt es an die Total-Zahl ("341 g" → "3419"),
  //    explodiert das Total → unrealistische Restmakros. Wenn ein angezeigter Übrig-Wert vorliegt UND die Rest-kcal
  //    absurd hoch sind, jedes Total mit/ohne Trailing-9 durchprobieren und die Kombi nehmen, deren Rest-kcal dem Übrig
  //    am nächsten liegt. Greift NUR bei aufgeblähten Werten (>6000 kcal) — saubere/Ring-Split-Fälle bleiben unberührt.
  if (!kcalComputed && computedKcal > 6000 && kcal > 0) {
    const eat = macros.map(p => p.eaten);
    const opt = macros.map(p => (p.total % 10 === 9 && p.total >= 20) ? [p.total, (p.total - 9) / 10] : [p.total]);
    let bestC = null;
    for (const a of opt[0]) for (const b of opt[1]) for (const c of opt[2]) {
      const rr = [Math.max(0,a-eat[0]), Math.max(0,b-eat[1]), Math.max(0,c-eat[2])];
      const d = Math.abs((rr[0]*4 + rr[1]*4 + rr[2]*9) - kcal);
      if (bestC == null || d < bestC.d) bestC = { d, rr };
    }
    carbs = bestC.rr[0]; protein = bestC.rr[1]; fat = bestC.rr[2];
    computedKcal = carbs*4 + protein*4 + fat*9;
  }
  // Plausibilitäts-Stopp: wenn die Rest-Makros trotzdem absurd zum angezeigten Übrig passen, lieber abbrechen
  // als Müll eintragen (onImport zeigt dann den OCR-Text zur Diagnose).
  if (!kcalComputed && kcal > 0 && computedKcal > kcal * 3 + 1500) return null;

  // 4) Fett an die angezeigten Rest-Kalorien angleichen: ergeben die Rest-Makros zusammen MEHR kcal als "Übrig"
  //    (Rundung / Ballaststoff-Kalorien / App-Inkonsistenz), Fett so weit senken (≥0), dass 4·C + 4·P + 9·F = Übrig aufgeht.
  if (!kcalComputed && kcal > 0 && (4*carbs + 4*protein + 9*fat) > kcal) {
    fat = Math.max(0, Math.round((kcal - 4*carbs - 4*protein) / 9 * 10) / 10);
  }

  const r = { carbs, protein, fat, kcal };
  if (kcalComputed) r.kcalComputed = true;
  return r;
}

// Bild für die OCR aufbereiten: zu große Screenshots verkleinern (iOS-Speicher), KLEINE hochskalieren
// (Makro-Balken-Schrift ist winzig → größere Glyphen = deutlich bessere Erkennung, weniger "g→9"-Fehler).
// maxSide = Downscale-Obergrenze; kleiner als ~1700px → hoch auf ~2400px (Ziel). Gibt Blob oder Original zurück.
function downscaleImage(file, maxSide) {
  return new Promise(resolve => {
    try {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = () => {
        URL.revokeObjectURL(url);
        const mx = Math.max(im.width, im.height);
        let scale = 1;
        if (mx > maxSide) scale = maxSide / mx;            // zu groß → runter
        else if (mx < 1700) scale = Math.min(2.5, 2400 / mx); // klein → hoch (bessere OCR)
        if (Math.abs(scale - 1) < 0.01) { resolve(file); return; }
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width*scale); cv.height = Math.round(im.height*scale);
        const ctx = cv.getContext("2d");
        ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
        ctx.drawImage(im, 0, 0, cv.width, cv.height);
        cv.toBlob(b => resolve(b || file), "image/png");
      };
      im.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
      im.src = url;
    } catch (e) { resolve(file); }
  });
}
// OCR eines Screenshots → geparste Makros (oder null). Tesseract.js kommt per CDN-Script-Tag als globales Tesseract.
async function ocrMacroScreenshot(file, onProgress) {
  if (typeof Tesseract === "undefined") throw new Error("OCR library not loaded yet");
  const img = await downscaleImage(file, 2600);
  const { data } = await Tesseract.recognize(img, "deu", {
    logger: msg => { if (msg.status === "recognizing text" && onProgress) onProgress(msg.progress); }
  });
  return { text: data.text, parsed: parseMacroScreenshot(data.text) };
}

// ═══ Schalentier-Allergie — PERMANENT ausgeschlossen, in ALLEN Restaurants (kein Schalter, User 13.09.2026) ═══
// Krebstiere + Weichtiere. Fisch bleibt erlaubt. Ausgeschlossen wird nur, was TATSÄCHLICH enthalten ist: der Name verrät es
// (SHELLFISH_RE) ODER die Allergenliste sagt „enthält" (SHELLFISH_NAMES bzw. Item-Flag shellfish:true aus dem Update-Skript).
// „Kann Spuren enthalten" zählt NICHT. Genutzt im Pool von alaCarteCombos, in BYO-Optimizern und im SEARCH_INDEX.
const SHELLFISH_RE = /garnele|shrimp|scampi|gambas|prawn(?!less)|krabbe|crab|krebs|hummer|lobster|langust|langoust|crayfish|muschel|mussel|clam|auster|oyster|scallop|tintenfisch|calamar|squid|sepia|oktopus|octopus|pulpo|meeresfr|frutti di mare|seafood|california|\bebi\b/i;
// Exakte, kleingeschriebene Namen, deren Allergenliste Schalentier ENTHÄLT, obwohl der Name es nicht verrät
const SHELLFISH_NAMES = new Set([]);
// Fehltreffer des Regex: diese Wortteile werden VOR dem Regex-Test aus dem Namen entfernt (Austernpilze sind Pilze,
// Muschelnudeln sind Pasta). Echte Schalentier-Wörter daneben greifen weiter („Muschelnudeln mit Garnelen" → raus).
const SHELLFISH_SAFE = ["austernpilz", "austern-pilz", "austernseitling", "oyster mushroom", "muschelnudel", "muschelpasta"];
function isShellfish(x) {
  if (!x) return false;
  if (x.shellfish === true) return true;                       // Flag aus der Allergenliste („enthält")
  const n = String(x.name || "").normalize("NFC").toLowerCase().trim();
  const base = n.replace(/\s*\([^)]*\)\s*$/, "").trim();       // Name ohne angehängtes " (…)"
  if (SHELLFISH_NAMES.has(n) || SHELLFISH_NAMES.has(base)) return true;
  let s = n;
  for (const safe of SHELLFISH_SAFE) s = s.split(safe).join(" ");
  return SHELLFISH_RE.test(s);
}

// Kurzname einer Bestellung: "2× Hähnchen Bowl + Edamame" (Duplikate zusammengefasst, Reihenfolge des ersten Auftretens)
function comboLabel(items) {
  const key = x => x.id + "|" + x.name;
  const counts = {}; items.forEach(x => counts[key(x)] = (counts[key(x)] || 0) + 1);
  const seen = new Set();
  return items.filter(x => { const k = key(x); if (seen.has(k)) return false; seen.add(k); return true; })
    .map(x => (counts[key(x)] > 1 ? counts[key(x)] + "× " : "") + x.name).join(" + ");
}
// Order-Guide-Schritte einer à-la-carte-Bestellung: [{l:"2×", v:"Hähnchen Bowl"}, …]; orderNote = Pflicht-Auswahl der Plattform, die der Gast
// so setzen soll (z.B. McDonald's Nuggets „Sauce 1/2, Sauce 2/2: Ohne Sauce“ — die Werte gelten ohne die inklusive Sauce)
function acOrderSteps(items) {
  const key = x => x.id + "|" + x.name;
  const counts = {}, uniq = [];
  for (const x of items) { const k = key(x); if (!counts[k]) { counts[k] = 0; uniq.push(x); } counts[k]++; }
  return uniq.map(x => ({ l: counts[key(x)] + "×", v: (x.orderName || x.name) + (x.orderNote ? " — " + x.orderNote : "") }));
}
// Stabiler Ergebnis-Key (sortierte Item-IDs) → markiert die gewählte Karte auch nach Neuberechnung und Tab-Wechsel.
// BYO-Ergebnisse dürfen einen eigenen .key mitliefern.
function resultKey(r) {
  if (!r) return null;
  if (r.key) return r.key;
  return (r.items || []).map(x => x.id).sort().join("|");
}

// À-la-carte-Kern (identisch zum London-Tool, nur Options-Objekt statt Positionsparametern):
// Singles + Paare voll (Duplikate erlaubt), Triples per Beam (beste 80 Paare). maxN=Infinity (∞-Chip): Stufe 4+ erweitert
// die besten Kombos so lange um je 1 Item, wie sich der Score verbessert (harte Obergrenze 12 Items). Top 20.
// opts: distinctBy(x) = keine zwei Items mit gleichem Key · dedupKey(items) = gleichwertige Ergebnisse zusammenfassen ·
//       resultFilter(items) = „muss X enthalten" · baseItems = feste Basis in JEDER Kombo (maxN zählt nur die Zusätze; 0 = nur die Basis)
//       · priced = Ergebnisse tragen price (Σ Item-Preise in €) · maxPrice = harte Obergrenze in € inkl. Basis (null/undefined = keine)
function alaCarteCombos(t, mode, p, pool, maxN, opts) {
  const o = opts || {};
  pool = pool.filter(x => !isShellfish(x)); // Schalentier permanent raus (Allergie)
  const dk = o.distinctBy || null;
  const distinctOk = dk ? (items, x) => { const k = dk(x); return !items.some(y => dk(y) === k); } : null;
  const BS = (o.baseSets && o.baseSets.length) ? o.baseSets : null;
  const B = !BS && (o.baseItems && o.baseItems.length) ? o.baseItems : null;
  const cents = x => Math.round((x.price || 0) * 100);
  const mp = o.maxPrice == null || o.maxPrice === "" ? NaN : Number(o.maxPrice);
  const budget = isFinite(mp) ? Math.round(mp * 100) : Infinity;
  if (B && B.reduce((a, x) => a + cents(x), 0) > budget) return [];
  // Kombination bewerten; über dem Preislimit → null
  const mk = items => {
    const c = items.reduce((a, x) => a + cents(x), 0);
    if (c > budget) return null;
    const n = sumN(items, 1), r = { items, nutrition: n, score: score(n, t, mode, p) };
    if (o.priced) r.price = c / 100;
    return r;
  };
  const R = [];
  const byScore = (a, b) => a.score - b.score;
  const finish = () => {
    R.sort(byScore);
    const RF = o.resultFilter ? R.filter(r => o.resultFilter(r.items)) : R;
    if (o.dedupKey) {
      const seenK = new Set(), out = [];
      for (const r of RF) { const k = o.dedupKey(r.items); if (seenK.has(k)) continue; seenK.add(k); out.push(r); if (out.length >= 20) break; }
      return out;
    }
    return RF.slice(0, 20);
  };
  // Mehrere mögliche Basen (Pflicht-Gerichte mit Varianten, optimizeAC): jede Basis allein und jede Basis + 1 Item vollständig; Basis + 2 Items
  // ebenfalls vollständig, solange das höchstens AC_BASESET_FULL Kombinationen sind (ein Pflicht-Gericht mit ≤ 12 Varianten), sonst per Beam;
  // danach gemeinsamer Beam über alle Basen (beste 80 je Stufe, nur verbessernde Zusätze) — maxN zählt die Zusätze
  if (BS) {
    const seen = new Set(), keyOf = items => items.map(y => y.id).sort().join("|");
    for (const b of BS) { const k = keyOf(b); if (seen.has(k)) continue; seen.add(k); const r = mk(b.slice()); if (r) R.push(r); }
    let frontier = [];
    if (maxN >= 1) for (const b of BS) for (const x of pool) {
      if (distinctOk && !distinctOk(b, x)) continue;
      const items = [...b, x], k = keyOf(items);
      if (seen.has(k)) continue; seen.add(k);
      const r = mk(items);
      if (r) { R.push(r); frontier.push(r); }
    }
    let depth = 1;
    if (maxN >= 2 && BS.length * pool.length * (pool.length + 1) / 2 <= AC_BASESET_FULL) {
      // Summen als Vektoren in derselben Additions-Reihenfolge wie sumN (gleiche Rundung, gleicher Score); nur die besten AC_BASESET_KEEP
      // Kandidaten werden als Ergebnis-Objekte ausformuliert (Rangliste 20 + Beam 80 + Puffer für Duplikate über Basen)
      const KN = KEYS.length, PN = pool.length, vec = new Float64Array(PN * KN), pc = pool.map(cents);
      pool.forEach((x, i) => KEYS.forEach((k, q) => { vec[i * KN + q] = x[k] || 0; }));
      const tmp = new Array(KN), rv = new Array(KN);
      let best = [], thr = Infinity;
      for (let bi = 0; bi < BS.length; bi++) {
        const b = BS[bi], bc = b.reduce((a, x) => a + cents(x), 0);
        if (bc > budget) continue;
        const bv = KEYS.map(k => b.reduce((a, x) => a + (x[k] || 0), 0));
        for (let i = 0; i < PN; i++) {
          if (bc + pc[i] > budget || (distinctOk && !distinctOk(b, pool[i]))) continue;
          for (let q = 0; q < KN; q++) tmp[q] = bv[q] + vec[i * KN + q];
          for (let j = i; j < PN; j++) {
            if (bc + pc[i] + pc[j] > budget || (dk && dk(pool[i]) === dk(pool[j])) || (distinctOk && !distinctOk(b, pool[j]))) continue;
            for (let q = 0; q < KN; q++) rv[q] = Math.round((tmp[q] + vec[j * KN + q]) * 10) / 10;
            const sc = scoreVec(rv, t, mode, p);
            if (sc >= thr) continue;
            best.push({ s: sc, bi, i, j });
            if (best.length >= 2 * AC_BASESET_KEEP) { best.sort((x, y) => x.s - y.s); best.length = AC_BASESET_KEEP; thr = best[AC_BASESET_KEEP - 1].s; }
          }
        }
      }
      best.sort((x, y) => x.s - y.s);
      const next = [];
      for (const c of best.slice(0, AC_BASESET_KEEP)) {
        const items = [...BS[c.bi], pool[c.i], pool[c.j]], k = keyOf(items);
        if (seen.has(k)) continue; seen.add(k);
        const r = mk(items);
        if (r) { R.push(r); next.push(r); }
      }
      frontier = next; depth = 2;
    }
    while (depth < maxN && depth < 12 && frontier.length) {
      frontier.sort(byScore); frontier = frontier.slice(0, 80);
      const next = [];
      for (const pr of frontier) for (const x of pool) {
        if (distinctOk && !distinctOk(pr.items, x)) continue;
        const items = [...pr.items, x], k = keyOf(items);
        if (seen.has(k)) continue; seen.add(k);
        const r = mk(items);
        if (r && (depth < 2 || r.score < pr.score)) { R.push(r); next.push(r); }
      }
      frontier = next; depth++;
    }
    return finish();
  }
  if (B) R.push(mk(B.slice())); // nur die Basis
  if (maxN >= 1) for (const x of pool) { const r = mk(B ? [...B, x] : [x]); if (r) R.push(r); }
  if (maxN >= 2) {
    const pairs = [];
    for (let i = 0; i < pool.length; i++) for (let j = i; j < pool.length; j++) {
      if (dk && dk(pool[i]) === dk(pool[j])) continue; // distinct: gleicher Key (inkl. i==j) raus
      const r = mk(B ? [...B, pool[i], pool[j]] : [pool[i], pool[j]]);
      if (!r) continue;
      R.push(r); pairs.push(r);
    }
    if (maxN >= 3) {
      pairs.sort(byScore);
      const seen = new Set();
      let frontier = [];
      for (const pr of pairs.slice(0, 80)) for (const x of pool) {
        if (distinctOk && !distinctOk(pr.items, x)) continue;
        const items = [...pr.items, x];
        const key = items.map(y => y.id).sort().join("|");
        if (seen.has(key)) continue; seen.add(key);
        const r = mk(items);
        if (!r) continue;
        R.push(r); frontier.push(r);
      }
      let depth = 3;
      while (depth < maxN && depth < 12 && frontier.length) { // harte Obergrenze 12 Items als Sicherheitsnetz
        frontier.sort(byScore); frontier = frontier.slice(0, 80);
        const next = [];
        for (const pr of frontier) for (const x of pool) {
          if (distinctOk && !distinctOk(pr.items, x)) continue;
          const items = [...pr.items, x];
          const key = items.map(y => y.id).sort().join("|");
          if (seen.has(key)) continue; seen.add(key);
          const r = mk(items);
          if (r && r.score < pr.score) { R.push(r); next.push(r); }
        }
        frontier = next; depth++;
      }
    }
  }
  return finish();
}

// ═══ Build-Your-Own-Bowl-Kern (Gruppen-Menü mit base / protein / extra / dip, z.B. Compleat „Build your Bowl") ═══
// Exakte Suche: Die Rangliste der K = 30 besten Bowls ist identisch mit der vollständigen Durchrechnung, in beiden Modi
// (tests.js und der Benchmark prüfen das). Zwei Teile:
// 1) Kern = Base-/Protein-Portionen + Dip. Start je 1 Base × 1 Protein, Erweiterung in fester Reihenfolge (jede Kombination genau einmal).
//    a) Makro-Modus und Kalorien-Modus ohne Präferenzen: Der Score ist je Nährwert konvex und alle Beiträge sind ≥ 0. Der Nutzen
//       eines Zusatzes u ist deshalb bei einer kleineren Bowl nie kleiner als bei einer größeren: Verbessert u die Teil-Bowl T nicht,
//       ist jede Bowl S, die T und u enthält, höchstens so gut wie S ohne u. Erweitert wird daher nur um VERBESSERNDE Zusätze
//       (das findet das Optimum); die übersprungenen Bowls S werden am Ende nachgetragen, indem zu den Ranglisten-Bowls einzelne
//       Kern-Portionen ergänzt werden (S ohne u steht selbst in der Rangliste).
//    b) Kalorien-Modus mit Präferenzen (Energieanteile → nicht konvex): alle Kerne, abgeschnitten nur über die Untergrenze bowlShareLB.
//    In beiden Fällen fallen ganze Teilbäume weg, wenn ein Ziel schon überschritten ist oder mit den restlichen Kern-Bausteinen
//    (Kapazität SUF) plus der größten Extras-Summe (EMX) nicht mehr erreichbar ist.
// Zeitbudget: Nur Extrem-Einstellungen (sehr hohe Ziele + Dips + viele Portionen, v.a. Uber Eats mit halben Portionen) brauchen länger als
// BOWL_MAX_MS. Dann endet die Suche mit der bis dahin besten Rangliste und das Ergebnis trägt approx = true (UI-Hinweis). Für Tests gibt es
// zusätzlich ein deterministisches Arbeitsbudget in Baum-Knoten (opts.maxWork).
// 2) Extras je Kern: alle Extras-Teilmengen (≤ max. Extras) liegen als Punkte in einem k-d-Baum; Branch & Bound mit einer
//    Box-Untergrenze (bowlBoxLB) findet exakt alle Ergänzungen unter der Ranglisten-Schwelle. Der Baum hängt nur von den erlaubten
//    Extras ab → Cache.

// score() in Vektorform (Reihenfolge wie KEYS) für die inneren Schleifen — muss exakt score() entsprechen (tests.js prüft das)
function scoreVec(n, t, mode, p) {
  let s = 0;
  if (mode === "macros") {

// k-d-Baum über alle Extras-Teilmengen (Punkte = 8 Nährwert-Summen, M = Bitmaske der Extras, PR = Preis in Cent; PMIN = billigster Punkt je

const BOWL_MAX_MS = 500;        // Zeitbudget je Suche: länger blockiert auch eine Extrem-Einstellung das iPhone nicht (realistische Ziele: meist < 50 ms)

//          group, role, ing, amount, unit, maxQty, price, half?, variant?, orderName?, order?:[{ group, name }], kcal … salt, Flags }] }] }

  const ownG = menu.groups.filter(g => g.own), nForced = cls => forcedExtras.filter(e => e.cls === cls).length;
  for (const g of ownG) if (nForced(g.id) > g.max) return Object.assign([], { conflict: forcedExtras.filter(e => e.cls === g.id).map(e => e.opt.ing) });
  // Fester Anteil jeder Bowl: Bestandteile ohne Auswahl + Pflicht-Extras (Nährwerte OFF, Preis offPc)
  const OFF = new Float64Array(8);
  let offPc = 0;
  for (const x of fixed) { for (let k = 0; k < 8; k++) OFF[k] += x[KEYS[k]] || 0; offPc += cents(x); }
  for (const e of forcedExtras) { for (let k = 0; k < 8; k++) OFF[k] += e.v[k]; offPc += e.pc; }
  budget -= offPc;
  if (budget < 0) return [];
  const maxE = Math.max(0, Math.min(extraMax, o.maxExtras == null ? 6 : o.maxExtras) - nForced(""));
  for (const e of extras) e.ci = e.cls ? 1 + ownG.findIndex(g => g.id === e.cls) : 0;
  const idx = bowlIndex(extras, [maxE, ...ownG.map(g => g.max - nForced(g.id))]);
  const gmax = [roleMax.base, roleMax.protein, 1, 1];
  if ((need.base && !(gmax[0] >= 1)) || (need.protein && !(gmax[1] >= 1))) return [];
  // größter Energieanteil eines Makros über alle Bausteine (Anteil einer Summe ≤ größter Einzelanteil)
  let shareMax = 1;
  for (const v of [...core.map(u => u.v), ...extras.map(u => u.v), ...forcedExtras.map(u => u.v), ...fixed.map(x => KEYS.map(k => x[k] || 0))]) {
    const kc = v[0], m = Math.max(v[6] * 4, v[3] * 4, v[1] * 9);
    if (m > 0) shareMax = Math.max(shareMax, kc > 0 ? m / kc : Infinity);
  }
  if (!isFinite(shareMax)) shareMax = 1e9;
  // Kalorien-Modus mit Präferenzen → Kern-Suche b)
  const shares = mode !== "macros" && !!(p && (p.hp || p.lp || p.hc || p.lc || p.hf || p.lf));
  // Kapazität für Untergrenzen ganzer Teilbäume: SUF[j] = was Kern-Bausteine ab Index j höchstens noch beitragen (je Portionen-Rolle
  // min(Σ qmax·v, Gruppen-Maximum × größter Baustein), je Einzelauswahl der größte Baustein); EMX = größte Extras-Summe (Wurzel des k-d-Baums)
  const C = core.length, SUF = new Float64Array((C + 1) * 8);
  const sumR = [new Float64Array(8), new Float64Array(8)], maxR = [0, 1, 2, 3].map(() => new Float64Array(8));
  for (let j = C - 1; j >= 0; j--) {
    const u = core[j];
    for (let k = 0; k < 8; k++) {
      if (u.g < 2) sumR[u.g][k] += u.qmax * u.v[k];
      if (u.v[k] > maxR[u.g][k]) maxR[u.g][k] = u.v[k];
      let capK = maxR[2][k] + maxR[3][k];
      for (let g = 0; g < 2; g++) if (maxR[g][k] > 0) capK += Math.min(sumR[g][k], gmax[g] * maxR[g][k]);
      SUF[j * 8 + k] = capK;
    }
  }
  const EMX = idx.HI.subarray(0, 8);
  // rhoSuf[j] = kleinstes L / kcal der Kern-Bausteine ab Index j und aller Extras (für bowlShareLB; der feste Anteil steckt schon im Kern)
  const rhoSuf = new Float64Array(C + 1).fill(Infinity);
  if (shares) {
    const ratio = v => { const L = bowlShareL(v, p); return v[0] > 0 ? L / v[0] : L < 0 ? -Infinity : Infinity; };
    for (const u of extras) rhoSuf[C] = Math.min(rhoSuf[C], ratio(u.v));
    for (let j = C - 1; j >= 0; j--) rhoSuf[j] = Math.min(rhoSuf[j + 1], ratio(core[j].v));
  }
  const dist = (v, lo, hi) => v < lo ? lo - v : v > hi ? v - hi : 0;
  // Untergrenze für Kern c + JEDE Erweiterung um Kern-Bausteine ab Index j und Extras: jeder Nährwert endet in [c, c + SUF[j] + EMX]
  const subLB = (c, j) => {
    const o8 = j * 8;
    let lb = 0;
    if (t.fibMin != null) lb += Math.max(0, t.fibMin - c[5] - SUF[o8 + 5] - EMX[5]) * 0.5;
    if (t.sMin != null) lb += Math.max(0, t.sMin - c[7] - SUF[o8 + 7] - EMX[7]) * 0.3;
    if (shares) return lb + bowlShareLB(c, t, p, rhoSuf[j], shareMax, c[0] + SUF[o8] + EMX[0]);
    if (t.fibMax != null && c[5] > t.fibMax) lb += (c[5] - t.fibMax) * 0.5;
    if (t.sMax != null && c[7] > t.sMax) lb += (c[7] - t.sMax) * 0.3;
    if (mode === "macros") {
      if (t.protein > 0) lb += dist(t.protein, c[6], c[6] + SUF[o8 + 6] + EMX[6]) / Math.max(t.protein, 1) * 3;
      if (t.carbs > 0) lb += dist(t.carbs, c[3], c[3] + SUF[o8 + 3] + EMX[3]) / Math.max(t.carbs, 1) * 2;
      if (t.fat > 0) lb += dist(t.fat, c[1], c[1] + SUF[o8 + 1] + EMX[1]) / Math.max(t.fat, 1) * 2;
    } else if (t.kcal > 0) lb += dist(t.kcal, c[0], c[0] + SUF[o8] + EMX[0]) / Math.max(t.kcal, 1) * 4;
    return lb;
  };

  const q = new Uint8Array(C), gc = [0, 0, 0, 0], ih = new Uint8Array(Math.max(1, slots.size)), lowOK = new Int32Array(C);
  let cp = 0; // Preis des aktuellen Kerns in Cent (ohne Grundpreis und festen Anteil)
  const workMax = o.maxWork == null ? BOWL_MAX_WORK : o.maxWork, msMax = o.maxMs == null ? BOWL_MAX_MS : o.maxMs;
  const clock = typeof performance !== "undefined" && performance.now ? () => performance.now() : () => Date.now(), t0 = clock();
  let work = 0, aborted = false; // Budgets: Baum-Knoten aller Abfragen; die Uhr wird alle 4096 Knoten gelesen
  const top = []; // Rangliste der K besten { s, q, m, pc } (aufsteigend); thr = Score des K-ten
  let thr = Infinity;
  const insert = (s, qq, m, pc) => {
    const item = { s, q: qq, m, pc };
    let i = top.length;
    top.push(item);
    while (i > 0 && top[i - 1].s > s) { top[i] = top[i - 1]; i--; }
    top[i] = item;
    if (top.length > K) top.pop();
    if (top.length === K) thr = top[K - 1].s;
  };
  const { P, M, PR, perm, LO, HI, PMIN, NL, NR, NS, NE } = idx;
  const tot = new Float64Array(8), stack = new Int32Array(256);
  const query = (c, rem) => { // alle Extras-Teilmengen für Kern c unter der Schwelle und im Preisrahmen rem (Branch & Bound im Baum)
    let sp = 0;
    stack[sp++] = 0;
    while (sp) {
      if (++work > workMax || ((work & 4095) === 0 && clock() - t0 > msMax)) { aborted = true; return; }
      const nd = stack[--sp];
      if (PMIN[nd] > rem || bowlBoxLB(c, LO, HI, nd * 8, t, mode, p) >= thr) continue;
      if (NL[nd] < 0) {
        for (let i = NS[nd]; i < NE[nd]; i++) {
          const pi = perm[i];
          if (PR[pi] > rem) continue;
          const b = pi * 8;
          for (let k = 0; k < 8; k++) tot[k] = c[k] + P[b + k];
          const s = scoreVec(tot, t, mode, p);
          if (s < thr) insert(s, q.slice(), M[pi], cp + PR[pi]);
        }
      } else {
        const l = NL[nd], r = NR[nd];
        const lbL = PMIN[l] > rem ? Infinity : bowlBoxLB(c, LO, HI, l * 8, t, mode, p);
        const lbR = PMIN[r] > rem ? Infinity : bowlBoxLB(c, LO, HI, r * 8, t, mode, p);
        if (lbL <= lbR) { if (lbR < thr) stack[sp++] = r; if (lbL < thr) stack[sp++] = l; } // nähere Box zuerst besuchen
        else { if (lbL < thr) stack[sp++] = l; if (lbR < thr) stack[sp++] = r; }
      }
    }
  };
  const ND = Array.from({ length: core.reduce((a, u) => a + u.qmax, 0) + 2 }, () => new Float64Array(8));
  const dfs = (start, depth, s) => { // Kern erweitern (feste Reihenfolge → jede Kombination genau einmal)
    const n = ND[depth], n2 = ND[depth + 1];
    for (let i = start; i < C; i++) {
      if (aborted) return;
      const u = core[i];
      if (i < lowOK[i]) continue; // unter dem Repräsentanten einer Pflicht-Klasse (Seed) → gehört zu einem anderen Seed
      if (q[i] >= u.qmax || gc[u.g] >= gmax[u.g] || cp + u.pc > budget) continue;
      if (u.slot >= 0 && ih[u.slot] + u.hu > capHU) continue;
      for (let k = 0; k < 8; k++) n2[k] = n[k] + u.v[k];
      const s2 = shares ? 0 : scoreVec(n2, t, mode, p);
      if (!shares && !(s2 < s - 1e-9)) continue; // a) nur verbessernde Zusätze
      if (subLB(n2, i) >= thr) continue;
      q[i]++; gc[u.g]++; cp += u.pc; if (u.slot >= 0) ih[u.slot] += u.hu;
      query(n2, budget - cp);
      dfs(i, depth + 1, s2);
      q[i]--; gc[u.g]--; cp -= u.pc; if (u.slot >= 0) ih[u.slot] -= u.hu;
    }
  };
  // Pflicht-Klassen: jede Bowl braucht ≥1 Kern-Baustein je Klasse (Base, Protein laut require; jede Pflicht-Zutat einer Kern-Rolle).
  // Seed = je Klasse der Baustein mit dem kleinsten Index in der Bowl („Repräsentant“); die Erweiterung nimmt keine Bausteine einer Klasse
  // unter deren Repräsentanten → jede Bowl gehört zu genau einem Seed. Konsistenz: liegt der Repräsentant r einer Klasse auch in einer
  // früheren Klasse, ist r ≥ deren Repräsentant; liegt ein früherer Repräsentant in dieser Klasse, ist r ≤ ihm.
  const classes = [];
  if (need.base) classes.push(core.map((u, i) => u.g === 0 ? i : -1).filter(i => i >= 0));
  if (need.protein) classes.push(core.map((u, i) => u.g === 1 ? i : -1).filter(i => i >= 0));
  for (const [ing, r] of incRole) if (r !== "extra") classes.push(core.map((u, i) => u.opt.ing === ing && bowlRole(u.opt) === r ? i : -1).filter(i => i >= 0));
  if (classes.some(cl => !cl.length)) return [];
  const inCl = classes.map(cl => new Set(cl)), reps = new Int32Array(classes.length), seeds = [];
  const pickSeeds = ci => {
    if (ci === classes.length) {
      const uniq = [...new Set(reps)], nn = new Float64Array(8);
      const g4 = [0, 0, 0, 0], hs = new Map();
      let pc = 0;
      for (const i of uniq) {
        const u = core[i];
        g4[u.g]++; pc += u.pc;
        if (u.slot >= 0) hs.set(u.slot, (hs.get(u.slot) || 0) + u.hu);
        for (let k = 0; k < 8; k++) nn[k] += u.v[k];
      }
      if (g4.some((c, g) => c > gmax[g]) || [...hs.values()].some(h => h > capHU) || pc > budget) return;
      for (let k = 0; k < 8; k++) nn[k] += OFF[k];
      seeds.push({ reps: Array.from(reps), uniq, nn, pc, lb: subLB(nn, 0) + bowlBoxLB(nn, LO, HI, 0, t, mode, p) });
      return;
    }
    for (const r of classes[ci]) {
      let fits = true;
      for (let cj = 0; cj < ci && fits; cj++) {
        if (inCl[cj].has(r) && r < reps[cj]) fits = false;
        if (inCl[ci].has(reps[cj]) && reps[cj] < r) fits = false;
      }
      if (fits) { reps[ci] = r; pickSeeds(ci + 1); }
    }
  };
  pickSeeds(0);
  // Seeds nach Aussicht sortiert: gute Bowls früh → niedrige Schwelle früh (Reihenfolge frei, bleibt exakt)
  seeds.sort((x, y) => x.lb - y.lb);
  for (const sd of seeds) {
    if (aborted) break;
    q.fill(0); ih.fill(0); lowOK.fill(-1); gc[0] = gc[1] = gc[2] = gc[3] = 0;
    for (const i of sd.uniq) { const u = core[i]; q[i] = 1; gc[u.g]++; if (u.slot >= 0) ih[u.slot] += u.hu; }
    for (let ci = 0; ci < classes.length; ci++) for (const i of classes[ci]) if (sd.reps[ci] > lowOK[i]) lowOK[i] = sd.reps[ci];
    cp = sd.pc;
    const n = ND[0];
    n.set(sd.nn);
    if (subLB(n, 0) >= thr) continue;
    query(n, budget - cp);
    dfs(0, 0, shares ? 0 : scoreVec(n, t, mode, p));
  }
  // a) Nachtragen: zu jeder Ranglisten-Bowl einzeln jede erlaubte Kern-Portion ergänzen, bis keine neue Bowl mehr in die Rangliste kommt
  if (!shares && !aborted) {
    const seen = new Set(top.map(it => it.q.join() + "|" + it.m));
    const nut = new Float64Array(8), cnt = [0, 0, 0, 0], hus = new Uint8Array(Math.max(1, slots.size));
    for (let changed = true; changed;) {
      changed = false;
      for (const it of top.slice()) {
        if (it.done) continue;
        it.done = true;
        nut.set(OFF); cnt[0] = cnt[1] = cnt[2] = cnt[3] = 0; hus.fill(0);
        for (let i = 0; i < C; i++) if (it.q[i]) {
          const u = core[i];
          cnt[u.g] += it.q[i];
          if (u.slot >= 0) hus[u.slot] += u.hu * it.q[i];
          for (let k = 0; k < 8; k++) nut[k] += u.v[k] * it.q[i];
        }
        for (let j = 0; j < extras.length; j++) if ((it.m >>> j) & 1) for (let k = 0; k < 8; k++) nut[k] += extras[j].v[k];
        for (let i = 0; i < C; i++) {
          const u = core[i];
          if (it.q[i] >= u.qmax || cnt[u.g] >= gmax[u.g] || it.pc + u.pc > budget) continue;
          if (u.slot >= 0 && hus[u.slot] + u.hu > capHU) continue;
          for (let k = 0; k < 8; k++) tot[k] = nut[k] + u.v[k];
          const s = scoreVec(tot, t, mode, p);
          if (!(s < thr)) continue;
          const q2 = it.q.slice(); q2[i]++;
          const key = q2.join() + "|" + it.m;
          if (seen.has(key)) continue;
          seen.add(key);
          insert(s, q2, it.m, it.pc + u.pc);
          changed = true;
        }
      }
    }
  }
  // Ausformulieren; Anzeige-Nährwerte wie überall über sumN (1 Dezimale), Score darauf neu berechnet; Preis inkl. Grundpreis + festem Anteil
  const build = it => {
    const parts = [], items = fixed.slice(), ex = forcedExtras.map(e => e.opt);
    let dip = null, side = null;
    for (let i = 0; i < C; i++) if (it.q[i]) {
      const u = core[i];
      if (u.g === 2) { dip = u.opt; continue; }
      if (u.g === 3) { side = u.opt; continue; }
      parts.push({ opt: u.opt, qty: it.q[i] });
      for (let c = 0; c < it.q[i]; c++) items.push(u.opt);
    }
    for (let j = 0; j < extras.length; j++) if ((it.m >>> j) & 1) ex.push(extras[j].opt);
    ex.sort((a, b) => ORD.get(a.id) - ORD.get(b.id));
    for (const x of ex) { parts.push({ opt: x, qty: 1 }); items.push(x); }
    if (side) items.push(side);
    if (dip) items.push(dip);
    const key = parts.map(pt => pt.opt.id + "x" + pt.qty).join("+") + (side ? "|" + side.id : "") + "|" + (dip ? dip.id : "nodip");
    return { key, parts, dip, side, fixed, items, price: (baseCents + offPc + it.pc) / 100 };
  };
  if (o.raw) {
    const raw = top.map(it => { const b = build(it); return { key: b.key, rawScore: it.s, price: b.price }; });
    if (aborted) raw.approx = true;
    return raw;
  }
  const out = top.map(it => {
    const r = build(it);
    r.nutrition = sumN(r.items, 1);
    r.score = score(r.nutrition, t, mode, p);
    r.rawScore = it.s;
    return r;
  });
  out.sort((a, b) => a.score - b.score || a.rawScore - b.rawScore);
  const res = out.slice(0, 20);
  if (aborted) res.approx = true; // Rangliste nicht vollständig geprüft (Arbeitsbudget erschöpft)
  return res;
}

// Kurz-Zusammenfassung einer Bowl: "Basmatireis + 2× Hähnchen + Edamame + Joghurt-Salatdressing" (Einzelauswahl am Ende: Brot, Dip)
function bowlSummary(res) {
  return [...res.parts.map(pt => (pt.qty > 1 ? pt.qty + "× " : "") + (pt.opt.short || pt.opt.name)), ...[res.side, res.dip].filter(Boolean).map(x => x.short || x.name)].join(" + ");
}
// Gleiche Bestellung in anderer Anordnung: dieselben Zutaten (Menge, Varianten doppelt, feste Bestandteile) und dieselben Nährwerte, z.B. Chidoba
// „Chicken Cup + Beef“ = „Beef Cup + Chicken“ oder Subway „Ham + Chicken Teriyaki“ = „Chicken Teriyaki + Ham“ (Sub- und Extra-Portion gleich)
function bowlSameKey(r) {
  // je Portion: Zutat + ihre Werte (Variante = 2 Portionen); die gerundete Summe taugt nicht, sie hängt von der Summier-Reihenfolge ab
  const one = x => x.ing + ":" + KEYS.map(k => (x.variant ? (x[k] || 0) / 2 : x[k] || 0)).join("/");
  const ings = [];
  for (const pt of r.parts) for (let i = 0; i < pt.qty * (pt.opt.variant ? 2 : 1); i++) ings.push(one(pt.opt));
  for (const x of [r.side, r.dip]) if (x) for (let i = 0; i < (x.variant ? 2 : 1); i++) ings.push(one(x));
  for (const f of r.fixed || []) ings.push("fix:" + one(f));
  return (r.type || r.size || "") + "|" + ings.sort().join(",");
}
// Doppelte Anordnungen zusammenfassen: je Schlüssel bleibt die günstigste (bei gleichem Preis die zuerst gereihte) an der Position der ersten
function bowlDedupe(list) {
  const best = new Map(), order = [];
  for (const r of list) {
    const k = bowlSameKey(r), cur = best.get(k);
    if (!cur) { best.set(k, r); order.push(k); }
    else if ((r.price || 0) < (cur.price || 0) - 1e-9) best.set(k, r);
  }
  return order.map(k => best.get(k));
}
// Rolle einer Menü-Option: base / protein / extra / dip / side (fehlt → Gruppen-id, wie bei Wolt)
function bowlRole(x) { return x.role || x.group; }
// Preis als „€12.50" (UI Englisch)
function bowlEuro(v) { return "€" + (Math.round((v || 0) * 100) / 100).toFixed(2); }
// Hinweis, wenn die Plattform in Pflicht-Gruppen etwas vorauswählt: Wolt zeigt für „Build your Bowl“ 4,00 € auf der Menükarte,
// weil der Pflicht-Dip mit „Curvy Curry Dip“ (2,00 €) vorbelegt ist — der Grundpreis sind 2,00 € (User-Rückfrage, im Wolt-UI am
// 16.09.2026 geprüft). Der Rechner rechnet immer Grundpreis + tatsächlich gewählte Optionen; ohne Dip stellt man die Gruppe
// wie im Order Guide auf „Ohne Dip“ (0 €).
function bowlPreselectNote(menu, platform) {
  const pre = (menu && menu.preselected) || [];
  if (!pre.length) return "";
  const card = (menu.basePrice || 0) + pre.reduce((sum, x) => sum + (x.price || 0), 0);
  const none = pre.map(x => (menu.groups.find(g => g.id === x.group) || {}).none).filter(Boolean);
  return " " + (platform || "The platform") + " shows " + bowlEuro(card) + " on the menu card because " + pre.map(x => x.name + " " + bowlEuro(x.price)).join(" + ") +
    " is preselected; prices here are the base price plus what the order guide lists" + (none.length ? ", so switch that group to “" + none.join("” / “") + "” when the guide says so." : ".");
}
// Bestellschritte je Plattform-Gruppe in Menü-Reihenfolge: Mengen bei Base/Protein (wenn die Gruppe oder Option mehr als 1 erlaubt) und bei
// Stepper-Extras (maxQty > 1), Häkchen-Extras ohne Menge; leere Einzelauswahl-Gruppen (Dip/Dressing, Brot) und leere Pflicht-Gruppen (min ≥ 1)
// mit ihrer „ohne …“-Option. orderName = Name in der eigenen Gruppe (Varianten), order = zusätzliche Einträge in anderen Gruppen, zuerst
// (z.B. „Extra Dressing/Sauce“ in „Extra Brot/Dressing dazu?“, Subway „Extra Fleisch / Protein“ in „Extras“)
function bowlOrderSteps(menu, sel) {
  const steps = [{ l: "Item", v: menu.item }];
  const chosen = sel.parts.map(pt => ({ opt: pt.opt, qty: pt.qty }));
  for (const x of [sel.side, sel.dip]) if (x) chosen.push({ opt: x, qty: 1 });
  for (const g of menu.groups) {
    const choice = g.options.some(x => ["dip", "side"].includes(bowlRole(x)));
    const vals = [];
    for (const c of chosen) for (const e of c.opt.order || []) if (e.group === g.id) vals.push(e.name);
    for (const c of chosen) if (c.opt.group === g.id) {
      const r = bowlRole(c.opt);
      const withQty = ((r === "base" || r === "protein") && (g.max > 1 || c.opt.maxQty > 1)) || (r === "extra" && c.opt.maxQty > 1);
      vals.push((withQty ? c.qty + "× " : "") + (c.opt.orderName || c.opt.name));
    }
    if (!vals.length && g.none && (choice || g.min >= 1)) vals.push(g.none);
    if (vals.length) steps.push({ l: g.name, v: vals.join(" · ") });
  }
  return steps;
}
// Such-Index-Einträge: jede Option einmal (Proteine stehen bei Wolt doppelt), gesperrte Zutaten und Varianten (z.B. 2 Portionen Dressing) nie
function bowlSearchEntries(menu, blocked) {
  const out = [], seen = new Set();
  for (const g of menu.groups) for (const x of g.options) {
    if (x.variant || seen.has(x.name) || (blocked && blocked.has(x.ing))) continue;
    seen.add(x.name); out.push(x);
  }
  return out;
}
// Ausschluss-Liste: je Zutat genau ein Eintrag (id = Zutat-id → gilt für alle Gruppen, ganze + halbe Portionen und Varianten)
function bowlExcludables(menu, blocked) {
  const out = [], seen = new Set();
  for (const g of menu.groups) for (const x of g.options) {
    if (x.variant || seen.has(x.ing) || (blocked && blocked.has(x.ing))) continue;
    seen.add(x.ing); out.push({ id: x.ing, name: x.half ? String(x.short || x.name).replace(/^½\s*/, "") : (x.short || x.name), group: g.name });
  }

// aufgeteilt nach den Pflicht-Extras, die die Variante nicht schon enthält; include = diese Extras + Pflicht-Dressing
function stadtsalatMenus(ex, picks) {
  const allowed = id => !(ex && ex.has(id)), P = [...(picks || [])];
  const dishPick = P.find(id => STADTSALAT_KIND[id] === "dish");
  const extraPicks = P.filter(id => STADTSALAT_KIND[id] === "extra"), dressingPicks = P.filter(id => STADTSALAT_KIND[id] === "dressing");
  const menus = [];
  for (const base of [STADTSALAT.bowl, STADTSALAT.snack]) {
    const split = new Map();
    for (const v of base.groups.find(g => g.id === "gericht").options) {
      if (!allowed(v.ing) || Object.keys(v.contains).some(id => !allowed(id)) || (dishPick && v.ing !== dishPick)) continue;
      const forced = extraPicks.filter(id => !v.contains[id]), k = forced.join(",");
      if (!split.has(k)) split.set(k, { forced, options: [] });
      split.get(k).options.push(v);
    }
    for (const { forced, options } of split.values())
      menus.push(Object.assign({}, base, { groups: base.groups.map(g => g.id === "gericht" ? Object.assign({}, g, { options }) : g), include: [...forced, ...dressingPicks] }));

}
// Gleiche Bestellung in anderer Anordnung: dasselbe Gericht mit denselben Zutaten-Portionen und demselben Dressing, z.B. Holy Greek (Bio-Steak) + Extra
// Pulled-Bio-Chicken = Holy Greek (Pulled-Bio-Chicken) + Extra Bio-Steak → nur die günstigste bleibt (bei gleichem Preis die zuerst gereihte)
function stadtsalatSameKey(r) {
  const dish = stadtsalatDishOpt(r), cnt = Object.assign({}, dish.contains);
  for (const pt of r.parts) if (pt.opt.group === "extras") cnt[pt.opt.ing] = (cnt[pt.opt.ing] || 0) + pt.qty;
  return dish.ing + "|" + Object.keys(cnt).sort().map(k => k + ":" + cnt[k]).join(",") + "|" + (r.dip ? r.dip.id : "-");
}
// Exakte Suche je Menü (bowlCombos), Ranglisten gemischt, gemeinsames Zeitbudget; Ergebnisse tragen type (bowl/snack)
function stadtsalatCombos(menus, t, mode, p, o) {
  o = o || {};
  const clock = typeof performance !== "undefined" && performance.now ? () => performance.now() : () => Date.now(), t0 = clock();
  const msMax = o.maxMs == null ? BOWL_MAX_MS : o.maxMs;
  let out = [], approx = false, conflict = null, missing = null, allMissing = menus.length > 0;
  for (const m of menus) {
    const left = msMax - (clock() - t0);
    if (!(left > 0) && out.length) { approx = true; break; }
    const res = bowlCombos(m, t, mode, p, Object.assign({}, o, { maxMs: Math.max(0, left), include: m.include }));
    if (res.approx) approx = true;
    if (res.conflict) conflict = res.conflict;
    if (res.missing) missing = missing ? missing.filter(id => res.missing.includes(id)) : res.missing.slice();
    else allMissing = false;
    if (!o.raw) for (const r of res) r.type = m.type;
    out = out.concat(res);
  }
  if (o.raw) out.sort((a, b) => a.rawScore - b.rawScore);
  else {
    out.sort((a, b) => a.score - b.score || a.rawScore - b.rawScore);
    const best = new Map(), order = [];
    for (const r of out) { const k = stadtsalatSameKey(r), cur = best.get(k); if (!cur) { best.set(k, r); order.push(k); } else if (r.price < cur.price - 1e-9) best.set(k, r); }
    out = order.map(k => best.get(k));
  }
  out = out.slice(0, o.raw ? 30 : 20);
  if (!out.length && conflict) return Object.assign([], { conflict });
  if (!out.length && allMissing && missing && missing.length) return Object.assign([], { missing });
  if (approx) out.approx = true;
  return out;
}
// Stadtsalat optimieren: Extras-Chip (st.extra), Schalter, Ausschluss-Liste, Pflicht-Liste (gehen an Schaltern vorbei), Preislimit
function stadtsalatOptimize(t, mode, p, st, ex, r, inc) {
  const x0 = (st && st.extra) || {};
  const allowed = id => !(ex && ex.has(id));
  const picks = new Set([...(inc || [])].filter(allowed));
  const unknown = [...picks].filter(id => !STADTSALAT_KIND[id]);
  if (unknown.length) return Object.assign([], { missing: unknown });
  const dishPicks = [...picks].filter(id => STADTSALAT_KIND[id] === "dish");
  if (dishPicks.length > 1) return Object.assign([], { conflict: dishPicks });
  const pass = switchPass(r, st);
  return stadtsalatCombos(stadtsalatMenus(ex, picks), t, mode, p, {
    cap: 1, maxExtras: x0.maxExtras == null ? 5 : x0.maxExtras, maxPrice: t && t.maxPrice,
    keep: x => allowed(x.ing) && (picks.has(x.ing) || pass(x)),

}
// Kurzname: Gericht (Protein) + Extras + Dressing
function stadtsalatSummary(res) {
  const dish = stadtsalatDishOpt(res);
  return [dish ? dish.short : "", ...res.parts.filter(pt => pt.opt.group === "extras").map(pt => pt.opt.short), res.dip ? res.dip.short : ""].filter(Boolean).join(" + ");
}
function stadtsalatCard(res, ctx) {
  const n = res.parts.filter(pt => pt.opt.group === "extras").length;
  const bits = res.type === "snack" ? ["Snack", "no options on Wolt"] : ["Bowl", n + (n === 1 ? " extra" : " extras"), res.dip ? (res.dip.variant ? "2× dressing" : "dressing") : "no dressing"];
  return h(ResultCard, { key: res.key, title: stadtsalatSummary(res), sub: bits.join(" · "), n: res.nutrition, price: res.price, selected: ctx.selected, onClick: ctx.onSelect });
}
// Detail-Panel: Aufschlüsselung je Gruppe (bowlPanel), darunter die Zutaten des Gerichts und Pflicht-Zutaten, die das Gericht schon enthält
function stadtsalatPanel(sel, ctx) {
  const dish = stadtsalatDishOpt(sel), d = dish && STADTSALAT_DISH[dish.ing], inc = (ctx && ctx.inc) || new Set();
  const inDish = dish ? Object.keys(dish.contains).filter(id => inc.has(id) && !sel.parts.some(pt => pt.opt.group === "extras" && pt.opt.ing === id)) : [];
  const name = id => (STADTSALAT.ingredients.find(x => x.id === id) || { name: id }).name;
  return h("div", null,
    bowlPanel(stadtsalatMenuOf(sel), sel, ctx),
    d && h("div", { style: { fontSize: 11, color: "#999", fontFamily: S.mono, margin: "-8px 0 16px", lineHeight: 1.4 } },
      "In the dish: " + dish.ingredients + (inDish.length ? " · ★ already in the dish: " + inDish.map(name).join(", ") : "")));
}
// Order Guide in Wolt-Reihenfolge: Artikel → Protein → Dressing (Inklusive) → Dressing (Extra) → Extra Zutaten (mit Menge, Wolt hat Stepper)
function stadtsalatOrderSteps(sel) {
  const dish = stadtsalatDishOpt(sel), d = STADTSALAT_DISH[dish.ing], G = STADTSALAT.groupNames;
  const steps = [{ l: "Item", v: d.name }];
  if (d.proteinGroup) steps.push({ l: d.proteinGroup, v: dish.proteinName });
  if (d.type === "bowl") {
    steps.push({ l: G.dressing, v: sel.dip ? sel.dip.orderName || sel.dip.name : d.dressingName + " (preselected, required) — not counted, don't use it" });
    if (sel.dip && sel.dip.variant) steps.push({ l: G.dressingExtra, v: "1× " + sel.dip.orderName });
    const ex = sel.parts.filter(pt => pt.opt.group === "extras");
    if (ex.length) steps.push({ l: G.extras, v: ex.map(pt => pt.qty + "× " + pt.opt.name).join(" · ") });
  }
  return steps;
}
// Such-Index: jede Variante, jede Extra-Zutat („… (extra)“) und jedes Dressing („… (dressing)“), ohne 2-Portionen-Varianten
function stadtsalatSearchEntries() {
  const out = [];
  for (const m of [STADTSALAT.bowl, STADTSALAT.snack]) for (const g of m.groups) for (const x of g.options) {
    if (x.variant) continue;
    out.push(Object.assign({}, x, { name: g.id === "gericht" ? x.name : x.name + (g.id === "dressing" ? " (dressing)" : " (extra)") }));
  }
  return out;
}
// Ausschluss- und Pflicht-Liste: Gerichte (Rolle dish = eine Pflicht ersetzt die andere), Extra-Zutaten, Dressings (Rolle dip)
function stadtsalatListEntries() {
  const ORDER = { dish: 0, extra: 1, dressing: 2 }, ROLE = { dish: "dish", extra: "extra", dressing: "dip" };
  const GROUP = { dish: "Dish", extra: STADTSALAT.groupNames.extras, dressing: STADTSALAT.groupNames.dressing };
  return STADTSALAT.ingredients.map((x, i) => ({ x, i })).sort((a, b) => ORDER[a.x.kind] - ORDER[b.x.kind] || a.i - b.i)
    .map(({ x }) => ({ id: x.id, name: x.name, group: GROUP[x.kind], role: ROLE[x.kind] }));
}
// Datenprüfung: beide Menüs gültig (bowlValidate), Varianten mit Gericht, Protein und enthaltenen Extra-Zutaten, keine Dressings mit Minze
function stadtsalatValidate() {
  const P = bowlValidate(STADTSALAT, ["bowl", "snack"]);
  const all = [];
  for (const m of [STADTSALAT.bowl, STADTSALAT.snack]) {
    const dg = m.groups.find(g => g.id === "gericht");
    if (!dg || !dg.options.length) { P.push(m.type + ": keine Gerichte"); continue; }
    for (const v of dg.options) {
      all.push(v);
      if (STADTSALAT_KIND[v.ing] !== "dish" || !STADTSALAT_DISH[v.ing] || STADTSALAT_DISH[v.ing].type !== m.type) P.push(m.type + ": " + v.id + " gehört zu keinem Gericht dieses Menüs");
      for (const c of Object.keys(v.contains || {})) if (STADTSALAT_KIND[c] !== "extra") P.push(v.id + ": enthaltene Zutat " + c + " ist keine Extra-Zutat");
      if (v.proteinIng && !(v.contains || {})[v.proteinIng]) P.push(v.id + ": Protein " + v.proteinIng + " fehlt in contains");
    }
  }
  for (const d of STADTSALAT.dishes) {
    if (!all.some(v => v.ing === d.id)) P.push(d.id + ": keine Variante");
    if (d.type === "bowl" && !d.dressingName) P.push(d.id + ": Standard-Dressing fehlt");
    if (d.proteinGroup && STADTSALAT_KIND[d.defaultProtein] !== "extra") P.push(d.id + ": Standard-Protein ist keine Extra-Zutat");
  }
  for (const g of STADTSALAT.bowl.groups) for (const o of g.options) if (/minze/i.test(o.name)) P.push("Minze im Menü: " + o.name);
  return P;
}

// ═══ Registry-Hilfsfunktionen (generisch für alle Einträge) ═══
const RESERVED_TABS = ["search", "all", "accurate"];

// Default-State eines Restaurants: Kategorien = on-Werte, Schalter = def, Max-Items = maxN (Default 5)
function defaultRestoState(r) {
  const cats = {};
  if (r.kind === "ac") r.data.cats.forEach(c => cats[c.id] = !!c.on);
  const sw = {};
  (r.switches || []).forEach(s => sw[s.id] = !!s.def);
  return { cats, maxN: r.maxN || 5, sw, sel: null, extra: r.initState ? r.initState() : null };
}
function initRestoStates(restos) {
  const o = {}; for (const r of restos) o[r.key] = defaultRestoState(r); return o;
}
// State für All/Accurate: Default-Kategorien, Schalter auf inAll (Default: def), Max-Items vom All-Chip
function allState(r, maxN) {
  const st = defaultRestoState(r);
  (r.switches || []).forEach(s => st.sw[s.id] = s.inAll !== undefined ? !!s.inAll : !!s.def);
  st.maxN = maxN || 5;
  return st;
}
// Schalter setzen; group = UI-exklusiv (einer an → alle anderen derselben Gruppe aus)
function toggleSwitch(r, sw, id, on) {
  const next = { ...sw, [id]: !!on };
  const s = (r.switches || []).find(x => x.id === id);
  if (on && s && s.group) for (const o of r.switches) if (o.id !== id && o.group === s.group) next[o.id] = false;
  return next;
}

// À la carte: Pool = Items der aktiven Kategorien (drink:true NIE; ein aktiver overridesCats-Schalter ignoriert die Chips),
// danach alle aktiven filter-Schalter (allow-Schalter: deren Items nur eingeschaltet); require-Schalter werden zum resultFilter → alaCarteCombos.
// ex = Set ausgeschlossener Item-ids (Ausschluss-Liste: ausverkauft / heute keine Lust) · inc = Pflicht-Produkte („Must include“, User 16.09.2026):
// feste Basis jeder Bestellung (zählen zu „Max. items“), gehen an Kategorien und Schaltern vorbei, nie an Ausschlüssen, Getränken oder Schalentier;
// unbekannte → [] mit missing. Haben alle Items Preise (Plattform-Menü), tragen Ergebnisse price und t.maxPrice ist eine harte Grenze.
// À la carte mit Varianten (Die gruene Kaffeebohne): Items mit product (Gericht) und choices (Options-ids) — ein Ausschluss trifft Item, Gericht
// oder Option; „Must include“ nennt das Gericht (eine seiner Varianten muss in die Bestellung)
function acExcluded(x, ex) { return !!ex && (ex.has(x.id) || (!!x.product && ex.has(x.product)) || (x.choices || []).some(c => ex.has(c))); }
const AC_BASESET_FULL = 400000; // alaCarteCombos baseSets: Basis + 2 Items vollständig bis zu so vielen Kombinationen
const AC_BASESET_KEEP = 400;    // davon ausformulierte beste Kandidaten
const AC_VARIANT_BASES = 200; // Pflicht-Gerichte mit Varianten: höchstens so viele Varianten-Kombinationen (beste Basis-Scores) als Basen
// Gleiche Bestellung aus Varianten-Sicht: dieselben Gerichte mit denselben Nährwerten und demselben Preis (z.B. vegane Option bei Gericht A statt B)
function acVariantKey(items) {
  const n = sumN(items, 1);
  return items.map(x => x.product || x.id).sort().join("+") + "|" + KEYS.map(k => n[k]).join("/") + "|" + items.reduce((a, x) => a + Math.round((x.price || 0) * 100), 0);
}
function optimizeAC(r, t, mode, p, st, ex, inc) {
  const D = r.data, sw = (st && st.sw) || {}, cats = (st && st.cats) || {};
  const drinkCats = new Set(D.cats.filter(c => c.drink).map(c => c.id));
  const active = (r.switches || []).filter(s => sw[s.id]);
  const override = active.some(s => s.overridesCats);
  let pool = D.items.filter(x => !drinkCats.has(x.cat) && (override || cats[x.cat]) && !acExcluded(x, ex));
  for (const s of active) if (s.filter) pool = pool.filter(s.filter);
  for (const s of r.switches || []) if (s.allow && !sw[s.id]) pool = pool.filter(x => !s.allow(x));
  const reqs = active.filter(s => s.require);
  const byId = new Map(D.items.map(x => [x.id, x]));
  const picks = [], groups = [], missing = [];
  for (const id of inc || []) {
    if (ex && ex.has(id)) continue;
    const x = byId.get(id);
    if (x) { if (drinkCats.has(x.cat) || isShellfish(x) || acExcluded(x, ex)) missing.push(id); else picks.push(x); continue; }
    const vs = D.items.filter(y => y.product === id && !drinkCats.has(y.cat) && !isShellfish(y) && !acExcluded(y, ex));
    if (vs.length) groups.push(vs); else missing.push(id);
  }
  if (missing.length) return Object.assign([], { missing });
  const maxN = (st && st.maxN) || r.maxN || 5;
  const priced = D.items.length > 0 && D.items.every(x => typeof x.price === "number");
  const variants = D.items.some(x => x.product);
  const run = (baseLen, extra) => alaCarteCombos(t, mode, p, pool, maxN === Infinity ? Infinity : Math.max(0, maxN - baseLen), Object.assign({
    distinctBy: r.distinctBy, dedupKey: r.dedupKey || (variants ? acVariantKey : undefined),
    resultFilter: reqs.length ? items => reqs.every(s => s.require(items)) : undefined,
    priced, maxPrice: priced && t ? t.maxPrice : null,
  }, extra));
  if (!groups.length) return run(picks.length, { baseItems: picks });
  // Pflicht-Gerichte mit Varianten: jede Kombination aus je einer Variante pro Gericht ist eine mögliche Basis (bei sehr vielen die
  // AC_VARIANT_BASES besten nach Score der Basis allein); eine gemeinsame Suche über alle Basen (alaCarteCombos baseSets)
  let bases = [[...picks]];
  for (const vs of groups) {
    bases = bases.flatMap(b => vs.map(v => [...b, v]));
    if (bases.length > AC_VARIANT_BASES) bases = bases.map(items => ({ items, s: score(sumN(items, 1), t, mode, p) })).sort((a, b) => a.s - b.s).slice(0, AC_VARIANT_BASES).map(x => x.items);
  }
  return run(picks.length + groups.length, { baseSets: bases });
}

// Dispatch ac ↔ byo (BYO-Einträge bringen die Methoden selbst mit, siehe Registry-Kommentar)
function runOptimize(r, t, mode, p, st, ex, inc) { return r.kind === "byo" ? r.optimize(t, mode, p, st, ex, r, inc) : optimizeAC(r, t, mode, p, st, ex, inc); }

function searchEntriesFor(r) { return r.kind === "byo" ? r.searchEntries() : r.data.items; }

const RESTO_BY_KEY = Object.fromEntries(RESTAURANTS.map(r => [r.key, r]));

// Registry-Prüfung (rein; tests.js erwartet [] für RESTAURANTS). Liefert lesbare Probleme.
function validateRegistry(restos) {
  const P = [], keys = new Set();
  const isNum = v => typeof v === "number" && isFinite(v) && v >= 0;
  for (const r of restos) {
    const k = r && r.key, tag = "[" + (k || "?") + "] ";
    if (typeof k !== "string" || !/^[a-z][a-z0-9]*$/.test(k)) P.push(tag + "key ungültig");
    else if (RESERVED_TABS.includes(k)) P.push(tag + "key ist ein reservierter Spezial-Tab");
    if (keys.has(k)) P.push(tag + "key doppelt");
    keys.add(k);
    for (const f of ["name", "label", "platform"]) if (typeof r[f] !== "string" || !r[f].trim()) P.push(tag + f + " fehlt");
    if (r.kind !== "ac" && r.kind !== "byo") P.push(tag + "kind muss ac oder byo sein");
    if (!Array.isArray(r.gradient) || r.gradient.length !== 2) P.push(tag + "gradient braucht [von, bis]");
    if (typeof r.accurate !== "boolean") P.push(tag + "accurate muss boolean sein");
    if (!(r.maxN > 0)) P.push(tag + "maxN fehlt");
    const swIds = new Set(), groups = {};
    for (const s of (r.switches || [])) {
      if (!s.id || swIds.has(s.id)) P.push(tag + "Schalter-id fehlt/doppelt: " + s.id);
      swIds.add(s.id);
      if (typeof s.label !== "string" || !s.label) P.push(tag + "Schalter ohne label: " + s.id);
      if (typeof s.def !== "boolean") P.push(tag + "Schalter def muss boolean sein: " + s.id);
      if (s.filter && typeof s.filter !== "function") P.push(tag + "filter ist keine Funktion: " + s.id);
      if (s.require && typeof s.require !== "function") P.push(tag + "require ist keine Funktion: " + s.id);
      if (s.force && (!Array.isArray(s.force) || s.force.some(id => typeof id !== "string") || r.kind !== "byo")) P.push(tag + "force muss eine Liste von Zutat-ids sein (nur Build-Your-Own): " + s.id);
      if (s.allow && typeof s.allow !== "function") P.push(tag + "allow ist keine Funktion: " + s.id);
      if (!s.filter && !s.require && !s.overridesCats && !s.force && !s.allow) P.push(tag + "Schalter ohne Wirkung: " + s.id);
      if (s.group) {
        const g = groups[s.group] || (groups[s.group] = { def: 0, all: 0 });
        if (s.def) g.def++;
        if (s.inAll !== undefined ? s.inAll : s.def) g.all++;
      }
    }
    for (const g in groups) if (groups[g].def > 1 || groups[g].all > 1) P.push(tag + "Gruppe " + g + ": mehr als ein Schalter gleichzeitig an");
    if (r.kind === "ac") {
      const D = r.data;
      if (!D || !Array.isArray(D.cats) || !Array.isArray(D.items)) { P.push(tag + "data.cats/data.items fehlen"); continue; }
      const catIds = new Set();
      for (const c of D.cats) {
        if (!c.id || catIds.has(c.id)) P.push(tag + "Kategorie-id fehlt/doppelt: " + c.id);
        catIds.add(c.id);
        if (typeof c.name !== "string" || typeof c.on !== "boolean") P.push(tag + "Kategorie unvollständig: " + c.id);
      }
      const ids = new Set();
      for (const it of D.items) {
        if (!it.id || ids.has(it.id)) P.push(tag + "Item-id fehlt/doppelt: " + it.id);
        ids.add(it.id);
        if (typeof it.name !== "string" || !it.name.trim()) P.push(tag + "Item ohne Namen: " + it.id);
        if (!catIds.has(it.cat)) P.push(tag + "Item mit unbekannter Kategorie: " + it.id + " → " + it.cat);
        for (const m of KEYS) if (!isNum(it[m])) P.push(tag + "Item " + it.id + ": " + m + " ist keine Zahl ≥ 0");
        if (it.price !== undefined && !isNum(it.price)) P.push(tag + "Item " + it.id + ": price ist keine Zahl ≥ 0");
        if (it.product !== undefined && (typeof it.product !== "string" || !it.product || typeof it.productName !== "string")) P.push(tag + "Item " + it.id + ": product/productName ungültig");
        if (it.choices !== undefined && (!Array.isArray(it.choices) || it.choices.some(c => !(D.choices || []).some(y => y.id === c)))) P.push(tag + "Item " + it.id + ": choices ungültig");
      }
      const prodIds = new Set(D.items.map(x => x.product).filter(Boolean));
      for (const c of D.choices || []) if (!c.id || typeof c.name !== "string" || ids.has(c.id) || prodIds.has(c.id)) P.push(tag + "Option ungültig oder id belegt: " + c.id);
      for (const pid of prodIds) if (ids.has(pid)) P.push(tag + "Gericht-id kollidiert mit Item-id: " + pid);
    } else if (r.kind === "byo") {
      for (const f of ["optimize", "renderConfig", "renderCard", "renderPanel", "orderSteps", "searchEntries"])
        if (typeof r[f] !== "function") P.push(tag + "BYO-Methode fehlt: " + f);
      if (r.includables !== undefined && typeof r.includables !== "function") P.push(tag + "includables ist keine Funktion");
    }
    if (typeof r.validate === "function") for (const pr of r.validate()) P.push(tag + pr);
  }
  return P;
}

// „All restaurants" / „Accurate restaurants": jedes (erlaubte) Restaurant mit Default-Kategorien + inAll-Schaltern,
// max. 1 Treffer pro Restaurant (dessen beste Bestellung), nach Score sortiert, Top 20. restos optional (für Tests).
// exclMap = Ausschluss-Listen ({ exclusionKey bzw. key: [ids] }) — ausverkaufte Dinge gelten auch hier; inclMap = Pflicht-Zutaten (gleiches Format).
function optimizeAll(t, mode, p, maxN, onlyAccurate, restos, exclMap, inclMap) {
  const list = (restos || RESTAURANTS).filter(r => !onlyAccurate || r.accurate);
  const picks = [];
  let approx = false;
  for (const r of list) {
    const xk = r.exclusionKey || r.key;
    const ex = new Set((exclMap && Array.isArray(exclMap[xk])) ? exclMap[xk] : []);
    const inc = new Set((inclMap && Array.isArray(inclMap[xk])) ? inclMap[xk] : []);
    const res = runOptimize(r, t, mode, p, allState(r, maxN), ex, inc);
    if (res && res.approx) approx = true;
    if (!res || !res.length) continue;
    let best = res[0];
    for (const x of res) if (x.score < best.score) best = x;
    picks.push(Object.assign({}, best, { _resto: r.key }));
  }
  picks.sort((a, b) => a.score - b.score);
  const outAll = picks.slice(0, 20);
  if (approx) outAll.approx = true;
  return outAll;
}

// ═══ „Add own order" — restaurantsübergreifender Such-Index (automatisch aus der Registry) ═══
function buildSearchIndex(restos) {
  const out = [], seen = new Set();
  for (const r of restos) {
    for (const it of (searchEntriesFor(r) || [])) {
      if (!it || typeof it.kcal !== "number" || !it.name || isShellfish(it)) continue; // Schalentier permanent raus
      const e = { resto: r.name, name: it.name };
      for (const k of KEYS) e[k] = it[k] || 0;
      const dk = e.resto + "|" + e.name + "|" + e.kcal;
      if (seen.has(dk)) continue;
      seen.add(dk); out.push(e);
    }
  }
  return out;
}
const SEARCH_INDEX = buildSearchIndex(RESTAURANTS);
// Umlaut-tolerant: Text in zwei Varianten falten (ä→ae und ä→a, ß→ss, Akzente weg) → „haehnchen", „hähnchen" und
// „hahnchen" finden dasselbe.
function foldVariants(s) {
  const base = String(s || "").normalize("NFC").toLowerCase();
  const strip = v => v.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  return [
    strip(base.replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss")),
    strip(base.replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss")),
  ];
}
// Alle Suchbegriffe müssen in Name + Restaurant vorkommen; kürzester Name zuerst (= bester Treffer)
function searchItems(query, limit, index) {
  const q = (query || "").trim(); if (!q) return [];
  const terms = q.split(/\s+/).map(foldVariants);
  return (index || SEARCH_INDEX).filter(x => {
    const hay = foldVariants(x.name + " " + x.resto);
    return terms.every(tv => tv.some(v => hay.some(hs => hs.includes(v))));
  }).sort((a, b) => a.name.length - b.name.length).slice(0, limit || 60);
}
// Summe einer eigenen Bestellung ([{item, qty}]) — wie sumN, 1 Dezimale
function orderTotal(entries) {
  const t = {}; KEYS.forEach(k => t[k] = 0);
  (entries || []).forEach(e => { const it = e.item || {}, q = e.qty || 0; KEYS.forEach(k => t[k] += (it[k] || 0) * q); });
  KEYS.forEach(k => t[k] = Math.round(t[k] * 10) / 10);
  return t;
}

// Suchtext-Treffer mit derselben Umlaut-Toleranz wie searchItems (alle Begriffe müssen vorkommen; leere Query = Treffer)
function matchesQuery(text, query) {
  const q = (query || "").trim();
  if (!q) return true;
  const hay = foldVariants(text);
  return q.split(/\s+/).map(foldVariants).every(tv => tv.some(v => hay.some(hs => hs.includes(v))));
}
// Was sich pro Restaurant als Pflicht-Zutat bzw. -Produkt wählen lässt: BYO = r.includables(), à la carte = Items bzw. Gerichte wie die
// Ausschluss-Liste (ohne Optionen)
function includablesFor(r) {
  if (r.kind === "byo") return r.includables ? r.includables() : [];
  const choiceIds = new Set((r.data.choices || []).map(c => c.id));
  return excludablesFor(r).filter(x => !choiceIds.has(x.id)).map(x => Object.assign({ role: "item" }, x));
}
// Was sich pro Restaurant ausschließen lässt: à la carte = Items (ohne Getränke/Schalentier) — bei Varianten je Gericht ein Eintrag plus die Optionen
// (data.choices, z.B. „vegane Hackbällchen“); BYO = r.excludables()
function excludablesFor(r) {
  if (r.kind === "byo") return r.excludables ? r.excludables() : [];
  const drink = new Set(r.data.cats.filter(c => c.drink).map(c => c.id));
  const catName = Object.fromEntries(r.data.cats.map(c => [c.id, c.name]));
  const items = r.data.items.filter(x => !drink.has(x.cat) && !isShellfish(x));
  if (!items.some(x => x.product)) return items.map(x => ({ id: x.id, name: x.name, group: catName[x.cat] }));
  const out = [], seen = new Set();
  for (const x of items) { const id = x.product || x.id; if (seen.has(id)) continue; seen.add(id); out.push({ id, name: x.productName || x.name, group: catName[x.cat] }); }
  for (const c of r.data.choices || []) if (!seen.has(c.id)) { seen.add(c.id); out.push({ id: c.id, name: c.name, group: c.group }); }
  return out;
}

function Chip({label,active,onClick,small}) {
  return h("button",{onClick,style:{
    padding:small?"4px 9px":"6px 13px",borderRadius:6,
    border:`1px solid ${active?S.green:"#3a3a3a"}`,
    background:active?"rgba(0,151,67,0.15)":"transparent",
    color:active?"#4ade80":"#999",fontSize:small?11:12,
    cursor:"pointer",fontFamily:S.mono,transition:"all .15s",
  }},label);
}

function NumIn({label,value,onChange,placeholder,unit,min=0,step}) {
  return h("div",{style:{flex:1,minWidth:80}},
    h("label",{style:{display:"block",fontSize:10,color:"#777",marginBottom:3,fontFamily:S.mono,textTransform:"uppercase",letterSpacing:1}},label),
    h("div",{style:{position:"relative"}},
      h("input",{type:"number",value,onChange:e=>onChange(e.target.value===""?"":Number(e.target.value)),
        placeholder,min,step,inputMode:step?"decimal":undefined,style:{width:"100%",padding:"9px 10px",paddingRight:unit?30:10,
        background:"#1a1a1a",border:"1px solid #333",borderRadius:6,color:"#fff",fontSize:14,
        fontFamily:S.mono,outline:"none",boxSizing:"border-box"}}),
      unit&&h("span",{style:{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",fontSize:10,color:"#555"}},unit)
    )
  );
}

function MacroBar({label,value,target,color,unit="g"}) {
  const pct=target>0?Math.min((value/target)*100,150):0;
  const diff=target>0?value-target:0;
  return h("div",{style:{marginBottom:6}},
    h("div",{style:{display:"flex",justifyContent:"space-between",fontSize:11,fontFamily:S.mono,color:"#b0b0b0",marginBottom:2}},
      h("span",null,label),
      h("span",null,
        h("span",{style:{color:"#fff",fontWeight:600}},value,unit),
        target>0&&h("span",{style:{color:diff>0?"#ff6b6b":"#51cf66",marginLeft:4}},"(",diff>0?"+":"",Math.round(diff),unit,")")
      )
    ),
    target>0&&h("div",{style:{height:4,background:"#2a2a2a",borderRadius:2,overflow:"hidden"}},
      h("div",{style:{height:"100%",width:`${Math.min(pct,100)}%`,background:color,borderRadius:2,transition:"width .4s"}})
    )
  );
}

// Ausschluss-Liste je Restaurant (ausverkauft / heute keine Lust): suchen, antippen → Optimizer + All/Accurate ignorieren es
function ExcludeCard({ list, excluded, onAdd, onRemove, onClear }) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const byId = useMemo(() => Object.fromEntries(list.map(x => [x.id, x])), [list]);
  const active = excluded.filter(id => byId[id]);
  const pool = list.filter(x => !excluded.includes(x.id) && matchesQuery(x.name + " " + (x.group || ""), q));
  const shown = pool.slice(0, 40);
  const linkBtn = { background: "none", border: "none", color: "#888", fontSize: 11, cursor: "pointer", fontFamily: S.mono, textDecoration: "underline", padding: 0 };
  return h("div", { style: { ...CARD, marginBottom: 16 } },
    h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", gap: 8 } },
      h("div", { style: { ...LBL, marginBottom: 0 } }, "Exclude items" + (active.length ? " · " + active.length + " excluded" : "")),
      h("button", { onClick: () => setOpen(!open), style: linkBtn }, open ? "Done ▴" : active.length ? "Edit ▾" : "Add ▾")
    ),
    active.length > 0 && h("div", { style: { display: "flex", flexWrap: "wrap", gap: 5, marginTop: 8, alignItems: "center" } },
      ...active.map(id => h("button", { key: id, onClick: () => onRemove(id), style: { padding: "4px 9px", borderRadius: 6, border: "1px solid #5b2a2a", background: "rgba(248,113,113,0.1)", color: "#fca5a5", fontSize: 11, cursor: "pointer", fontFamily: S.mono } }, byId[id].name + " ✕")),
      h("button", { onClick: onClear, style: { ...linkBtn, color: "#777", marginLeft: 4 } }, "Clear")
    ),
    open && h("div", { style: { marginTop: 10 } },
      h("div", { style: { fontSize: 11, color: "#777", marginBottom: 8, lineHeight: 1.4 } }, "Sold out or not in the mood? Tap an item to exclude it — the optimizer ignores it until you remove it (saved on this device)."),
      h("input", { type: "text", value: q, onChange: e => setQ(e.target.value), placeholder: "Search items…",
        style: { width: "100%", boxSizing: "border-box", background: "#0d0d0d", border: "1px solid #2a2a2a", borderRadius: 8, padding: "9px 12px", color: "#fff", fontSize: 14, fontFamily: S.font, outline: "none", marginBottom: 8 } }),
      shown.length === 0
        ? h("div", { style: { fontSize: 12, color: "#666", fontFamily: S.mono } }, "No matches.")
        : h("div", { style: { display: "flex", flexWrap: "wrap", gap: 5 } },
            ...shown.map(x => h(Chip, { key: x.id, label: "+ " + x.name, small: true, active: false, onClick: () => onAdd(x.id) }))),
      pool.length > shown.length && h("div", { style: { fontSize: 10, color: "#666", fontFamily: S.mono, marginTop: 6 } }, "+" + (pool.length - shown.length) + " more — type to search")
    )
  );
}
